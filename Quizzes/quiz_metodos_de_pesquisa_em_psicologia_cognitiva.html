  *{box-sizing:border-box}

  .rsm table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
  .rsm th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#8a8578;font-weight:600;padding:11px 14px;background:#faf9f6;border-bottom:1px solid #e4e0d8;white-space:nowrap}
  .rsm td{padding:11px 14px;border-bottom:1px solid #efece5;vertical-align:top;text-wrap:pretty}
  .rsm tr:last-child td{border-bottom:0}
  .rsm .key{background:#f2f6fb;border:1px solid #d6e2f4;border-radius:12px;padding:16px 18px;margin:0 0 18px}

<script type="text/html" id="resumoSrc"><h2>O pressuposto que unifica os métodos</h2>
<p>Antes de qualquer técnica de coleta, a psicologia cognitiva assume uma tese sobre o que a mente é: um <strong>sistema que processa informação</strong>. Entre o estímulo que chega e a resposta que sai existe uma etapa intermediária, descritível em passos, e é essa etapa que constitui o objeto da área. A formulação clássica desse pressuposto é a <strong>metáfora computacional</strong>: a função cognitiva ocupa, no organismo, o mesmo lugar que o programa ocupa no computador — recebe uma entrada, opera sobre ela e devolve uma saída.</p>

<p>A força da metáfora é metodológica, não ontológica. Ninguém afirma que o cérebro seja feito de circuitos lógicos; afirma-se que o nível adequado de descrição é o <strong>funcional</strong>. A comparação que Neisser propôs é a do técnico que quer descobrir como um computador foi programado: para entender como as informações são armazenadas, importa o conjunto de instruções, e é irrelevante se o suporte físico é disco rígido ou fita magnética. Transposta para a mente, a tarefa é descrever os procedimentos pelos quais a informação é elaborada dentro do organismo.</p>
<p>Esse pressuposto nasce por oposição. O modelo estímulo–resposta, herdado do behaviorismo, limitava a investigação à correlação entre condições externas e respostas observáveis, tratando o interior do indivíduo como uma <strong>caixa preta</strong> — não porque fosse inexistente, mas porque não se acreditava possível controlá-lo. A recusa cognitivista parte da constatação de que existem no indivíduo mecanismos que entram em ação no momento da resposta e que afetam retroativamente até a intensidade e a qualidade atribuídas ao próprio estímulo. A relação entre estímulo e resposta deixa de ser linear e passa a ser circular.</p>
<blockquote><p>Todo método descrito adiante — do cronômetro do tempo de reação à simulação em computador — só faz sentido sob essa suposição. Se não houvesse processamento intermediário, não haveria o que cronometrar nem o que modelar.</p></blockquote>
<p>O modelo de memória escrito em forma de regra condicional mostra o formato que a teoria assume quando leva a metáfora a sério: informação nova é conservada por pouco tempo; informação repetida passa a ser armazenada por mais tempo. A repetição é o operador que muda o destino do item. Escrita assim, como uma instrução de programa, a teoria fica explícita o bastante para ser testada.</p>

<h2>Como se estrutura uma pesquisa experimental</h2>
<p>O percurso experimental tem uma ordem, e a ordem carrega compromissos epistemológicos.</p>
<ol><li>Proposta ou escolha de um <strong>modelo teórico</strong> e formulação da <strong>hipótese de pesquisa</strong></li><li>Estabelecimento do experimento</li><li>Delimitação das variáveis</li><li>Escolha de um <strong>método estatístico</strong> de análise</li><li>Análise dos resultados</li><li>Confirmação ou refutação da hipótese</li><li>Discussão dos resultados</li></ol>

<p>O que está em jogo nessa sequência é que o experimento existe <strong>para testar a hipótese</strong>, e não para produzi-la. Inverter as duas primeiras etapas — coletar primeiro e procurar depois o que os dados dizem — produz um estudo que encontra qualquer coisa e não confirma nada, porque a hipótese formulada depois do resultado já nasce confirmada. Pela mesma razão o tratamento estatístico é escolhido antes da análise, e não depois de olhar os números.</p>
<p>Vale notar que as etapas 6 e 7 são distintas. Confirmar ou refutar a hipótese é uma operação restrita ao delineamento montado; discutir os resultados é confrontá-los com a literatura, apontar limites e propor o passo seguinte. Um estudo que salta a última etapa entrega um número sem significado teórico.</p>
<hr>
<h2>Variável independente e variável dependente</h2>
<div class="tbl"><table><thead><tr><th></th><th>Variável independente</th><th>Variável dependente</th></tr></thead><tbody><tr><td>Definição</td><td>a que o pesquisador determina e manipula</td><td>o comportamento que se pretende investigar</td></tr><tr><td>Papel</td><td>é o instrumento da pesquisa</td><td>é o objeto da pesquisa</td></tr><tr><td>Exemplos típicos</td><td>tamanho da lista, presença de ruído, congruência entre cor e palavra</td><td>tempo de resposta, número de acertos, itens evocados</td></tr></tbody></table></div>
<p>A variável dependente recebe esse nome porque se espera que seu valor <strong>dependa</strong> da manipulação feita. Já a independente é chamada assim por ser fixada de fora, pelo experimentador, e não por variar livremente. É esse ponto que separa o experimento dos demais delineamentos: quando a suposta causa varia sozinha e o pesquisador apenas a registra, o estudo deixa de ser experimental.</p>
<h4>Como identificar cada uma</h4>
<p>Pergunte o que foi <strong>decidido</strong> pelo pesquisador antes da coleta e o que foi <strong>medido</strong> durante ela. O que foi decidido é a independente; o que foi medido, a dependente. Um mesmo conceito pode ocupar os dois papéis em estudos diferentes: o tempo de resposta é a dependente num experimento de memória, mas passa a ser independente num estudo em que se impõe um prazo para responder e se mede a exatidão.</p>
<hr>
<h2>O tempo de reação como janela para o processo</h2>
<p>O tempo entre o estímulo e a resposta funciona como cronômetro do que acontece no meio do caminho. A lógica é comparativa: montam-se duas condições que difiram por uma única etapa suposta, e a <strong>diferença</strong> de tempo entre elas estima o custo dessa etapa. É uma medida barata, sensível e não invasiva — mas indireta, porque infere o processo em vez de observá-lo.</p>
<h4>Teste de memória de Sternberg</h4>
<p>O participante recebe listas de símbolos de tamanhos diferentes e responde se um item de teste estava na lista. O tamanho da lista é a variável independente; o tempo de resposta, a dependente. O resultado é sistemático: <strong>quanto maior a lista, maior o tempo de resposta</strong>.</p>
<p>O formato dessa relação é o que discrimina hipóteses. Se cada item acrescentado custa um incremento de tempo, a busca percorre os itens em série, um a um — é a <strong>teoria do escaneamento</strong> da memória de curto prazo. Um acesso direto ao conteúdo, sem varredura, produziria tempos praticamente constantes, independentes do tamanho da lista. Repare que nenhuma dessas conclusões vem de observar a memória: vem de observar a <em>forma</em> da relação entre duas variáveis.</p>
<h4>Efeito Stroop</h4>
<p>Nomear a cor da tinta em que uma palavra está escrita é lento e sujeito a erro quando a palavra nomeia outra cor. A leitura é um processo <strong>automático</strong> em leitores fluentes: dispara mesmo quando a tarefa pede outra coisa e mesmo contra a intenção do participante. O atraso na condição incongruente mede o esforço de controle necessário para vencer a interferência — ou seja, converte um conflito interno invisível em milissegundos mensuráveis.</p>
<hr>
<h2>Validade ecológica: controle contra generalização</h2>
<p><strong>Validade ecológica</strong> é o grau em que os resultados se transferem para as situações da vida real às quais se pretende generalizar. Não se confunde com controle experimental nem com representatividade da amostra: um estudo pode ser rigorosamente controlado, com amostra impecável, e ainda assim ter validade ecológica baixa, porque a tarefa não se parece com nada que a pessoa faça fora dali.</p>

<blockquote><p>Controle e validade ecológica costumam variar em sentidos opostos. Cada ganho de controle é obtido suprimindo variáveis do ambiente, e é justamente essa supressão que afasta a tarefa da vida real. Não existe delineamento que maximize os dois — existe a escolha, deliberada, de qual deles a pergunta exige.</p></blockquote>
<h4>Dois estudos de alta validade ecológica</h4>
<ul><li><strong>Godden e Baddeley — mergulhadores.</strong> Listas de palavras foram memorizadas em terra firme e debaixo d'água, e testadas nos dois ambientes. Cruzar o ambiente de aprendizagem com o ambiente de teste isola o papel do <strong>contexto físico</strong> na recuperação: lembrar melhor quando os dois coincidem indica que o contexto é codificado junto com o material.</li><li><strong>Logie e Kvavilashvili — memória prospectiva.</strong> Memória prospectiva é lembrar de <strong>executar uma ação</strong> num momento futuro, e não recuperar um conteúdo do passado. Testá-la dentro do laboratório é artificial, porque ali o participante está atento e sem tarefas concorrentes — exatamente as condições que o fenômeno não tem na vida cotidiana. Pedir que os participantes telefonem de casa para o laboratório em horários combinados devolve à tarefa as distrações que fazem parte dela. O preço é a perda de controle sobre o que acontece do outro lado da linha.</li></ul>
<hr>
<h2>O repertório de métodos e o que cada um autoriza concluir</h2>
<p>Nenhum método é superior aos demais em abstrato. A técnica se escolhe pela <strong>pergunta</strong>, e cada uma delas fecha e abre um conjunto de conclusões possíveis.</p>
<div class="tbl"><table><thead><tr><th>Método</th><th>O que mede</th><th>Vantagem</th><th>Limitação</th></tr></thead><tbody><tr><td>Experimento</td><td>efeito de uma variável manipulada sobre o desempenho</td><td>única via para afirmar relação causal</td><td>artificialidade e baixa validade ecológica</td></tr><tr><td>Estudo correlacional</td><td>associação entre medidas apenas observadas</td><td>permite estudar o que não se pode manipular</td><td>não separa causa, efeito e terceira variável</td></tr><tr><td>Eletroencefalografia</td><td>atividade elétrica cortical em milissegundos</td><td>resolução temporal altíssima, decurso fino do processo</td><td>localização espacial imprecisa</td></tr><tr><td>Ressonância funcional</td><td>variação de fluxo sanguíneo ligada à atividade neural</td><td>boa localização espacial das regiões envolvidas</td><td>sinal lento, de segundos, e convite à inferência reversa</td></tr><tr><td>Estudo de caso único</td><td>funções preservadas e perdidas após lesão</td><td>evidencia dissociações raras entre funções</td><td>lesão irrepetível e generalização frágil</td></tr><tr><td>Modelagem computacional</td><td>desempenho simulado por regras explícitas</td><td>obriga a teoria a ser completa e testável</td><td>ajustar-se ao dado não prova que o mecanismo é aquele</td></tr></tbody></table></div>
<h4>Correlação e causa</h4>
<p>Considere um estudo que observa que quem dorme menos acerta menos numa prova de atenção, sem manipular o sono de ninguém. O achado é uma <strong>associação</strong>, e apenas isso.</p>
<blockquote><p>Sem manipulação da variável suposta como causa, três explicações permanecem abertas: o sono afeta a atenção, a atenção afeta o sono, ou uma terceira variável — ansiedade, trabalho noturno, uso de telas — produz as duas. Apenas a manipulação experimental do sono, com alocação controlada dos participantes, sustentaria a afirmação causal.</p></blockquote>
<h4>O que a neuroimagem funcional registra</h4>
<p>O sinal da ressonância funcional é <strong>hemodinâmico</strong>: reflete mudanças na oxigenação do sangue que acompanham, com atraso de alguns segundos, a atividade de populações de neurônios. Não é o disparo de um neurônio isolado, e esse atraso é a razão pela qual a técnica localiza bem <em>onde</em> algo acontece e mal <em>quando</em> acontece. Quando a pergunta é temporal — em que milissegundo o cérebro passa a discriminar dois estímulos —, o registro elétrico é a ferramenta adequada. A escolha se faz pela pergunta, não pelo prestígio do equipamento.</p>
<blockquote><p><strong>Inferência reversa.</strong> Saber que um processo ativa uma região não autoriza concluir o processo a partir da ativação. As regiões cerebrais não mantêm correspondência de um para um com funções psicológicas: a amígdala participa de processamento emocional, mas também de vigilância, saliência e aprendizagem. Concluir "houve emoção porque a amígdala acendeu" só ganha alguma força quando a região é bastante seletiva e o delineamento inclui tarefas de controle.</p></blockquote>
<h4>Caso único e simulação</h4>
<p>O estudo de caso de um paciente com lesão cerebral é forte exatamente onde os estudos de grupo são fracos: quando uma função se perde e outra se preserva no mesmo indivíduo, há evidência de que as duas são <strong>separáveis</strong>. O limite é o número e a natureza do dano — a lesão é única, quase nunca circunscrita, e o cérebro pode ter se reorganizado depois dela. O caso, portanto, sugere arquitetura funcional e depende de replicação.</p>
<p>Já o modelo computacional obriga a explicitar cada passo da teoria em regras que efetivamente rodam. Se a simulação não reproduz o padrão de desempenho humano, a teoria está incompleta ou errada. O modelo não substitui a coleta de dados: existe para gerar previsões que os dados vão confrontar.</p>
<hr>
<h2>O psicólogo cognitivo: objeto e forma de investigação</h2>
<p>O psicólogo cognitivo estuda as <strong>bases do conhecimento humano</strong> — mais precisamente, os meios pelos quais o indivíduo alcança um conhecimento organizado do mundo em categorias e a maneira como esse conhecimento é utilizado para direcionar e planejar ações sobre o ambiente. O mundo da experiência é composto por um número enorme de objetos, eventos, pessoas e impressões; sem a capacidade de discriminá-los e categorizá-los, o indivíduo seria subjugado pela complexidade do ambiente.</p>
<p>Em terminologia mais tradicional, isso abrange <strong>percepção, memória, imagem mental, pensamento, raciocínio e aprendizagem</strong>. O interesse não recai apenas sobre como as informações externas são extraídas, mas especialmente sobre como são conceptualizadas e organizadas internamente para então serem usadas de maneira eficaz. Pressupõe-se que a resposta dada a uma situação-estímulo sofreu elaboração interna, e que essa elaboração depende de processos mentais presentes num momento determinado do desenvolvimento e em função de elaborações anteriores.</p>
<h4>A forma de investigar</h4>
<p>O estudo é <strong>empírico</strong>, não especulativo. A observação é instrumento fundamental, e observar em psicologia é mais difícil do que parece: exige abandonar a perspectiva particular do observador e reconstruir a perspectiva de mundo do sujeito observado — seu modo de operar sobre o ambiente e os significados que atribui às pessoas e às coisas. Ainda assim, a observação isolada não basta, por mais fidedigna que seja; é preciso estabelecer a relação entre <strong>observar, refletir e compreender</strong>. Estabelecida essa relação, o pesquisador levanta hipóteses e as testa, num trabalho que se aproxima do de qualquer cientista, podendo recorrer a métodos como o clínico ou a métodos vindos de outras áreas, como a Antropologia.</p>
<blockquote><p>O termo <em>estímulo</em> muda de sentido nesse enquadre. Numa perspectiva cognitiva, estímulo não é um evento físico pontual, mas uma <strong>situação-problema tomada como um todo</strong> — o que já o torna incompatível com a leitura behaviorista da mesma palavra.</p></blockquote>
<hr>
<h2>Fronteiras, mal-entendidos e o risco da setorização</h2>
<h4>Cognitivo não é sinônimo de piagetiano</h4>
<p>O método clínico foi o método de estudo de Piaget e é bastante usado na pesquisa cognitiva, embora não seja o único. Daí veio a ideia errônea de que psicólogo cognitivo e piagetiano seriam a mesma coisa. <strong>Método e teoria são separáveis</strong>: existem dezenas de estudos que empregam tarefas piagetianas — conservação de quantidades, inclusão de classes, egocentrismo — a partir de referenciais teóricos distintos, vários deles produzindo resultados que levaram à reanálise da própria teoria de Piaget. Partir de pressupostos de uma teoria não faz de ninguém seguidor dela. A analogia útil: Piaget está para a psicologia cognitiva assim como Freud está para a clínica — nenhum profissional pode ignorar a obra, e nem por isso todos são freudianos.</p>
<h4>Competência especializada e competência setorializada</h4>
<p>Diante de uma criança com dificuldade de aprendizagem, o psicólogo cognitivo tende a atribuí-la ao âmbito do desenvolvimento cognitivo; o clínico, a problemas pessoais da criança. Em ambos os casos, hipóteses alternativas são descartadas <strong>antes de serem examinadas</strong>.</p>
<div class="tbl"><table><thead><tr><th></th><th>Competência especializada</th><th>Competência setorializada</th></tr></thead><tbody><tr><td>Postura</td><td>reconhece o caráter parcial da própria investigação</td><td>trata o conhecimento de modo circular, fechado em si</td></tr><tr><td>Relação com outras áreas</td><td>conhecimento intercambiável, sensibilidade interdisciplinar</td><td>isolamento e fragmentação</td></tr><tr><td>Efeito sobre o caso</td><td>hipóteses concorrentes são testadas</td><td>hipóteses concorrentes são eliminadas a priori</td></tr></tbody></table></div>
<p>A proposta não é abolir a especialidade — ela é legítima e necessária ao progresso do conhecimento —, e sim impedir que a especialidade vire confinamento. O mesmo problema aparece na relação com a Pedagogia: o psicólogo que deriva implicações educacionais das próprias pesquisas sem considerar a contribuição pedagógica dá enfoque excessivamente psicológico a problemas pedagógicos; o pedagogo que operacionaliza resultados abstraindo o contexto teórico em que foram produzidos incorre em reducionismo. A transposição de resultados da pesquisa cognitiva para a prática é viável, mas exige trabalho conjunto e interdisciplinar.</p>
<h4>Duas divisões do mesmo território</h4>
<div class="tbl"><table><thead><tr><th></th><th>Tradição anglo-saxônica</th><th>Brasil</th></tr></thead><tbody><tr><td>Psicologia cognitiva</td><td>estrutura, processamento e funcionamento do conhecimento: processamento de informação, inteligência artificial, memória, raciocínio</td><td>engloba simultaneamente as duas perspectivas</td></tr><tr><td>Psicologia do desenvolvimento</td><td>como essas estruturas se modificam ao longo da vida, abrangendo também o social e o afetivo-emocional</td><td>frequentemente confundida com a obra de Piaget</td></tr></tbody></table></div>
<p>Tome-se a percepção como exemplo. Na divisão inglesa, a psicologia cognitiva pergunta em que consiste o fenômeno, como ele ocorre sob esta ou aquela circunstância e o que o influencia; a psicologia do desenvolvimento pergunta como ele se transforma com o tempo, como se caracteriza no início e no fim da infância, que fatores afetam a percepção infantil e quais afetam a adulta. É em função dessa divisão que a obra de Piaget se filia mais ao desenvolvimento do que à psicologia cognitiva em sentido estrito.</p>
<blockquote><p>A abordagem cognitiva pode, potencialmente, ser aplicada a qualquer área do estudo psicológico do indivíduo, estando de alguma forma implícita em todas elas. Reduzi-la a um setor restrito da psicologia gera isolamento disfuncional e perda dos dois lados.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +

  }).join('');

      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;

      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +

        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +
        '</div></div></section>';
}

/* ── resultado + gabarito comentado ────────────────────────────────────────── */
function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

function renderResult(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var c = counts(), pct = c.total ? Math.round(c.hit/c.total*100) : 0;

  var title='Precisa revisar', msg='Releia o material com atenção e refaça o quiz — as explicações abaixo cobrem cada erro.';

    }
    return '<div style="background:#fff;border:1px solid '+(open?'#c9c3b6':'#e4e0d8')+';border-radius:14px;overflow:hidden;transition:border-color .15s ease">' +

        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
