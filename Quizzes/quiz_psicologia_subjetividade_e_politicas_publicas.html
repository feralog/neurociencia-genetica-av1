<script type="text/html" id="resumoSrc"><h2>O ponto de partida: ler a história para desnaturalizar</h2>
<p>Maria da Graça Marchina Gonçalves examina, de forma sintética, como a psicologia se relacionou com o campo das políticas públicas ao longo de sua trajetória no Brasil. Ela esclarece que não pretende contar a história da psicologia brasileira em sentido estrito: suas considerações se apoiam em <strong>dois conjuntos de informações</strong>: (1) a produção já existente sobre essa história, útil para entender como hoje se relacionam a psicologia (enquanto ciência e enquanto profissão) e as políticas públicas; (2) os debates recentes em que os próprios psicólogos procuram definir que papel cabe à psicologia quando se trata de <strong>elaborar e implementar</strong> políticas públicas.</p>
<p>O capítulo começa com uma epígrafe de Pedro Ayres Magalhães, "O paraíso": a "escada de papelão" que se imagina "não leva a nada", enquanto a outra entrada, "mais apertada", foi "inventada por um anão" e tem um dragão de guarda. A autora não comenta os versos. Uma leitura possível (interpretação, não tese do texto): o caminho fácil e imaginado não conduz a lugar nenhum, e o verdadeiro é estreito e penoso, como o de uma psicologia que pretenda realmente estar nas políticas públicas.</p>
<p>Gonçalves se alinha às <strong>análises críticas da história da psicologia brasileira</strong>, entre elas as de Bock (1999, 2001, 2003), Antunes (1999), Lane (1995, 1996), Contini (1998), Furtado (1998), Silva (2003) e González-Rey (2003), além de outros. Esses estudos mostram que os traços centrais da psicologia (as teorias dominantes, seus procedimentos e instrumentos, suas práticas, os setores onde atua e até o modo como se configurou enquanto profissão) <strong>são respostas a demandas que a história foi produzindo</strong>. Por isso trazem à tona as <strong>contradições</strong> da psicologia, o <strong>caráter ideológico</strong> do que ela produz e os <strong>compromissos</strong> que nela se exprimem.</p>
<p>O eixo de leitura é a <strong>perspectiva sócio-histórica</strong>, e o método é <strong>desnaturalizar</strong>. Voltar à história permite perceber que, se a psicologia hoje ocupa certos lugares no campo social, é <strong>porque esses lugares foram construídos</strong> por práticas que conquistaram hegemonia e pelas representações que as legitimavam, tanto na teoria e no método quanto nas concepções que traziam embutidas. Só compreendendo como a psicologia se constituiu historicamente é possível pensar o lugar e o papel que lhe cabem nas políticas públicas.</p>
<blockquote><p><strong>Tese de método:</strong> o lugar que a psicologia ocupa hoje no campo social não decorre da "natureza" do psiquismo, nem de escolhas individuais dos profissionais, nem de um destino da ciência. Ele foi <strong>produzido historicamente</strong> por práticas que se tornaram hegemônicas e pelas representações que as justificaram. Desnaturalizar é mostrar essa produção, e mostrar que, por ter sido produzido, pode ser transformado.</p></blockquote>
<h4>Quatro tipos de inserção e dois compromissos</h4>
<p>Ao longo da história brasileira, o modo como a psicologia interveio no campo social dependeu das diferentes formas pelas quais ela se inseriu na sociedade. A autora distingue quatro:</p>
<div class="tbl"><table><thead><tr><th>Tipo de inserção</th><th>O que faz</th><th>Direção</th></tr></thead><tbody><tr><td>Aplicações práticas</td><td>controlam, enquadram e adaptam os indivíduos à forma que a sociedade capitalista vai ganhando no país</td><td>normalização</td></tr><tr><td>Expressões teóricas</td><td>apresentam concepções <strong>naturalizantes e normalizadoras</strong> das subjetividades</td><td>normalização</td></tr><tr><td>Concepções críticas</td><td>produzidas <strong>a partir das concepções tradicionais</strong> da psicologia, buscam alternativas inovadoras para a realidade brasileira</td><td>transformação</td></tr><tr><td>Propostas de ruptura</td><td><strong>rompem</strong> com os modelos tradicionais de atuação e colocam a psicologia a serviço da maioria, engajando os indivíduos na melhoria da qualidade de vida e até na construção de uma nova sociedade</td><td>transformação</td></tr></tbody></table></div>
<p>Disso resultam os <strong>dois compromissos</strong> presentes na atuação da psicologia no campo social. Um é o compromisso de <strong>normalizar, adaptar e adequar</strong> os indivíduos, a despeito de sua diversidade, aos lugares que a sociedade já tem reservados para eles. O outro aparece nas tentativas de abrir espaços de atuação que favoreçam expressões sociais <strong>questionadoras e inovadoras</strong>, capazes de remover as condições que bloqueiam o pleno desenvolvimento dos sujeitos. Assim, também na prática interventiva surgem caminhos distintos, que revelam o movimento histórico da sociedade.</p>
<blockquote><p><strong>Pegadinha:</strong> "concepções críticas" e "propostas de ruptura" não são a mesma coisa. As concepções críticas nascem <strong>de dentro</strong> das concepções tradicionais e buscam alternativas inovadoras; as propostas de ruptura <strong>rompem</strong> com os modelos tradicionais de atuação.</p></blockquote>
<hr>
<h2>Ausência presente, presença ausente, presença presente</h2>
<p>Sem querer simplificar, a autora resume, "grosso modo", a intervenção da psicologia no campo social em duas situações: <strong>(a)</strong> a psicologia ocupou um <strong>lugar secundário</strong> dentro das instituições sociais; e <strong>(b)</strong>, numa fase decisiva para se firmar como profissão, cresceu <strong>por fora das instituições conservadoras</strong>, procurando atender sem intermediários às necessidades concretas da população, sem passar por um Estado autoritário que não se propunha a responder às demandas populares. <strong>Ambas as situações dão conta de por que a psicologia esteve ausente das políticas públicas</strong>, mas se trata de ausências de sentido oposto.</p>
<ul><li><strong>"Ausência presente"</strong>: corresponde à psicologia <strong>aplicada à educação e ao trabalho</strong>, dentro das instituições tradicionais dessas áreas, e, como desdobramento delas, à <strong>psicologia clínica</strong>, encarregada do que não se ajustava. Está dentro das instituições, mas num papel secundário e adaptador; falta como participante de políticas que assegurem direitos.</li><li><strong>"Presença ausente"</strong>: corresponde à <strong>psicologia comunitária</strong>, isto é, a que se propõe a <strong>promover as pessoas</strong> e que, nas condições históricas em que nasceu, precisou crescer <strong>por fora das instituições conservadoras</strong>. Está de fato junto à população, mas não está no setor público.</li><li><strong>"Presença presente"</strong>: é a proposta para o momento atual. Criticar as instituições conservadoras já não basta: a crítica precisa vir <strong>junto com propostas para construir e fortalecer instituições democráticas</strong>.</li></ul>
<p>Com essa tipologia, a autora busca <strong>avaliar criticamente</strong> a posição ocupada pela psicologia nas políticas públicas, o que exige entender <strong>a que demandas históricas e sociais</strong> ela atende em cada situação e <strong>até que ponto questiona e renova</strong> a própria função.</p>
<blockquote><p><strong>A distinção que mais cai:</strong> "ausência presente" é a psicologia <strong>tradicional</strong> (aplicada à educação e ao trabalho, mais a clínica): está dentro das instituições, mas não serve às necessidades da população. "Presença ausente" é a psicologia <strong>comunitária</strong>: comprometida com a população, mas fora das instituições e do Estado. Atenção: para a autora, <strong>ambas são maneiras de a psicologia estar ausente das políticas públicas</strong>; o que muda é o tipo de ausência. Mais adiante, ela esclarece a primeira: a ausência daquele período era, no fundo, uma presença que reforçava políticas assistencialistas, patologizantes, curativas e individualizantes. Recurso de memorização (não é fórmula do texto): o <strong>substantivo</strong> diz se há compromisso com a população (ausência = não; presença = sim) e o <strong>adjetivo</strong> diz se ela está dentro das instituições (presente = dentro; ausente = fora). "Presença presente" junta as duas coisas.</p></blockquote>
<h4>Por que essa realidade mudou</h4>
<p>Essa "ausência" deixou de se sustentar por <strong>dois motivos</strong>. Primeiro, <strong>não dá mais para fechar os olhos às denúncias</strong>, repetidas há muito tempo e em contextos variados, de que a psicologia esteve <strong>comprometida com as elites</strong> do país. Segundo, o momento histórico <strong>já não se resume à crítica das instituições conservadoras</strong>: essa crítica tem de trazer consigo propostas de construção e fortalecimento de instituições democráticas.</p>
<p>A autora resume a conjuntura em três momentos. <strong>Primeiro</strong>, o <strong>Estado autoritário</strong> impedia políticas de desenvolvimento social, entendido como a satisfação das necessidades básicas de amplas camadas da população. <strong>Depois</strong>, veio o <strong>neoliberalismo</strong>, que mina as conquistas sociais responsáveis por um Estado forte e capaz de implementar políticas, empurrando tudo para a <strong>desregulamentação, a privatização e a lógica de mercado</strong>, rumo ao <strong>"Estado mínimo"</strong>. <strong>Agora</strong>, construir uma sociedade democrática implica <strong>ocupar os espaços públicos</strong>: participar da formulação de políticas de saúde, educação, trabalho, infância e juventude, segurança, habitação, mobilidade urbana e comunicação, e também dos <strong>órgãos de controle social</strong> dessas políticas.</p>
<p><em>Contexto (não é do texto):</em> "neoliberalismo" designa o conjunto de reformas que, no Brasil sobretudo nos anos 1990, defendeu a redução do papel do Estado, privatizações e a regulação pelo mercado. "Constituição Cidadã" é o apelido da Constituição de 1988.</p>
<p>O Brasil experimenta de modo peculiar a contestação dos fundamentos do <strong>Estado de bem-estar social</strong>, já que sua <strong>"Constituição Cidadã"</strong> é recente e <strong>ainda não foi efetivada</strong>: faltam os instrumentos legais e institucionais capazes de pôr seus princípios plenamente em prática.</p>
<blockquote><p><strong>Contradição central do período recente:</strong> as políticas sociais contam com <strong>respaldo constitucional</strong> para se ampliar e para criar sistemas de garantia de direitos, mas <strong>simultaneamente</strong> sofrem as <strong>investidas neoliberais</strong>, que atrasam ou até bloqueiam o avanço das conquistas sociais. Essa tensão reaparece muitas vezes no texto.</p></blockquote>
<h4>O plano do texto</h4>
<p>Para entender o papel do psicólogo nesse contexto, é preciso saber <strong>por quais caminhos a psicologia chega ao momento atual</strong> e reconhecer, em sua história, os <strong>limites, possibilidades e desafios</strong> para sua inserção nas políticas públicas. O texto se organiza em três partes:</p>
<ol><li><strong>A ausência da psicologia nas políticas públicas</strong>: a história brasileira lida em sua contradição, a da "ausência presente" e da "presença ausente".</li><li><strong>A presença da psicologia nas políticas públicas</strong>: as discussões recentes dos psicólogos e os desafios para uma "presença presente".</li><li><strong>Por uma presença crítica</strong>: propostas, a partir da perspectiva sócio-histórica, de uma atuação crítica e engajada na transformação social.</li></ol>
<hr>
<h2>Por que a psicologia ficou de fora: o recorte e as duas convicções</h2>
<p>Para falar em ausência, é preciso deixar claro o <strong>recorte</strong>. A autora se refere a <strong>políticas destinadas a garantir direitos sociais, formuladas e executadas pelo poder público</strong>, que para isso contrata especialistas de diversas áreas e, ao agir assim, responde a <strong>demandas sociais geradas pelo desenvolvimento econômico e pelos arranjos políticos</strong>, o que envolve também certos contornos para o papel do Estado.</p>
<p>De certo modo, a psicologia <strong>jamais esteve inteiramente ausente</strong> desse campo. Só que chegou a ele <strong>quase sempre de forma indireta</strong>, e isso deixou a prática profissional <strong>à margem</strong> do trabalho no setor público. O motivo não foram apenas as circunstâncias históricas em que a profissão se desenvolveu, mas <strong>também convicções que a própria psicologia produziu</strong>. Os dois fatores se entrelaçam.</p>
<h4>Primeira convicção: a psicologia neutra e o psicólogo "técnico"</h4>
<p>A primeira convicção trata a psicologia como <strong>neutra</strong>, dona de um <strong>saber científico sobre o homem aplicável em qualquer contexto</strong>: escolas, empresas, instituições de recuperação, grupos. Caberia ao psicólogo o papel de <strong>"especialista"</strong> ou <strong>"técnico"</strong>, que produz conhecimento sobre comportamento, emoções, aprendizagem, desenvolvimento, personalidade e relações interpessoais, conhecimento esse que serviria de guia ao trabalho <strong>de outros profissionais</strong>.</p>
<p>Desde cedo, a <strong>psicologia aplicada</strong> assumiu essa feição de <strong>auxiliar de outras áreas</strong>. Daí que sua presença nos setores sociais se resumisse, no essencial, a <strong>produzir laudos e diagnósticos</strong>, quase sem <strong>participar diretamente da execução de ações</strong> de atendimento aos indivíduos. E, quando havia atendimento, ele obedecia ao modelo tradicional da profissão: o do <strong>profissional liberal que atende individualmente, na clínica</strong>.</p>
<h4>Segunda convicção: a naturalização dos fenômenos psicológicos</h4>
<p>Ligada diretamente à primeira, a segunda convicção é a <strong>naturalização dos fenômenos psicológicos</strong>, acompanhada da procura por um <strong>conhecimento universal sobre o psiquismo humano</strong>. Um saber que se julga natural e universal <strong>legitima ações normalizadoras</strong>, que ajustam os indivíduos às situações dadas. Por esse caminho, também, a participação nas políticas públicas acaba mínima ou nula: a psicologia <strong>não precisaria criar conhecimentos e procedimentos próprios para cada situação</strong>, bastaria <strong>"aplicar"</strong> o saber já disponível.</p>
<blockquote><p><strong>Tese:</strong> são posições que se dizem neutras e, justamente por isso, <strong>ocultam os interesses a que servem</strong>. Neutralidade e naturalização não são defeitos técnicos: são convicções produzidas historicamente que encobrem o vínculo da psicologia com as elites brasileiras e com a ideologia dominante.</p></blockquote>
<hr>
<h2>As raízes: medicina, educação e trabalho</h2>
<h3>Controlar, higienizar, diferenciar, categorizar</h3>
<p>Em contextos variados, os autores críticos apontam o <strong>vínculo da psicologia brasileira com as elites e com a ideologia dominante</strong>. Partindo da ideia de que todo conhecimento está necessariamente ligado ao contexto social em que nasce, <strong>Antunes (1999)</strong> encontra esse vínculo já nas <strong>ideias psicológicas do Brasil colonial e do Império</strong>, que traduzem a <strong>necessidade das classes dominantes de controlar a população</strong>, e acompanha como a psicologia vai respondendo às exigências de cada época.</p>
<p><strong>Bock (2003)</strong>, com base em Massimi (1990) e em Antunes (1991; 1999), sintetiza essa leitura: as ideias psicológicas e, mais tarde, as teorias <strong>"responderam claramente a interesses das elites de controlar, higienizar, diferenciar e categorizar"</strong>, interesses ligados à preservação ou ao aumento do lucro e à reprodução do capital.</p>
<p>Antunes mostra ainda que, ao lado das concepções alinhadas aos interesses hegemônicos, existem produções que fazem <strong>contraponto</strong> às visões dominantes, embora geralmente <strong>não prevaleçam</strong>. Segundo ela, três fatores impulsionam o surgimento da psicologia brasileira: os <strong>traços históricos do capitalismo</strong> e suas particularidades no Brasil; o <strong>percurso de formação das ideias psicológicas</strong> até a psicologia se tornar ciência autônoma; e sua <strong>entrada em práticas sociais</strong>. Conclusão: a psicologia serviu sobretudo como <strong>instrumento de controle social e de adaptação dos indivíduos</strong>, inclusive quando, no século XX, foi convocada para ajudar na <strong>"modernização"</strong> do país.</p>
<h3>A trajetória institucional reconstruída por Antunes</h3>
<p>Na obra de Antunes, o que mais interessa à autora é a reconstrução dos caminhos pelos quais a psicologia se <strong>autonomizou e se institucionalizou</strong>, já que eles revelam como ela se inseriu no campo social:</p>
<ol><li><strong>Século XIX</strong>: a psicologia chega às instituições <strong>dentro da medicina, ao lado da psiquiatria</strong>; pouco depois, e ao mesmo tempo, <strong>dentro da educação</strong>.</li><li><strong>Início do século XX</strong>: essas duas presenças se firmam, com feições distintas na psiquiatria e na educação; além disso, a psicologia passa a ser <strong>aplicada ao trabalho, pela psicometria</strong>.</li></ol>
<p>Antunes deixa claro o peso dessas inserções para o crescimento da área. Na <strong>medicina</strong>, a psicologia foi produzida basicamente como <strong>ciência auxiliar da psiquiatria</strong>, mas, mesmo assim, teve reconhecido, ao menos em princípio, o estatuto de ciência e, com ele, a autonomia. Essa autonomia <strong>não resultou de um projeto definido de antemão</strong>: nasceu do próprio desenvolvimento da psicologia e de sua adaptação às necessidades criadas pelos problemas sociais do país (Antunes, 1999, p. 65). Na <strong>educação</strong>, nas primeiras décadas do século XX, estava <strong>a base principal a partir da qual a psicologia surgiu como ciência</strong>: por ela entraram no Brasil os saberes vindos da <strong>Europa e dos Estados Unidos</strong>, e foi ali que a psicologia <strong>exibiu com mais nitidez a autonomia teórica e prática que tinha</strong> (Antunes, 1999, p. 89).</p>
<p>Esse desenvolvimento, porém, tem <strong>caráter histórico</strong>, que se evidencia nos interesses que essas práticas atendiam:</p>
<div class="tbl"><table><thead><tr><th>Área</th><th>Lógica predominante</th></tr></thead><tbody><tr><td>Psiquiatria</td><td><strong>lógica higienista</strong>, que de algum modo se estende também à educação</td></tr><tr><td>Educação</td><td><strong>lógica de ajuste</strong> e <strong>enfoque individualizante</strong></td></tr><tr><td>Trabalho</td><td><strong>lógica adaptativa</strong> (psicologia aplicada ao trabalho)</td></tr></tbody></table></div>
<blockquote><p><strong>Duas faces ao mesmo tempo:</strong> essas inserções foram decisivas para a <strong>autonomização e institucionalização</strong> da psicologia <strong>e</strong>, no mesmo movimento, prenderam seu desenvolvimento aos <strong>interesses dominantes das elites</strong>. A "modernização" perseguida entre o fim do século XIX e o começo do XX significava <strong>ajustar o país à industrialização</strong>. As produções que questionavam essa lógica higienista, adaptativa e discriminadora existiram, mas <strong>não foram hegemônicas</strong>, justamente porque iam de encontro aos interesses dominantes.</p></blockquote>
<h3>Educação: normalidade e fracasso escolar</h3>
<p><strong>Patto (2003)</strong> sustenta que a história da psicologia brasileira faz parte da própria história do país e que é preciso levar em conta o <strong>"enraizamento sociopolítico da Psicologia"</strong>. Ela mostra que a psicologia aplicada à educação tinha como referência o <strong>conceito de "normalidade"</strong>, e que, nas condições em que se impôs, esse conceito equivalia a <strong>aceitar a ordem vigente sem questioná-la</strong>. Na prática, isso levou à <strong>procura do ajustamento</strong> e a <strong>algum tipo de exclusão de quem não se encaixava</strong>.</p>
<p>Patto observa que, examinada criticamente, a <strong>história da escola pública brasileira</strong> mostra desde a origem uma clara <strong>intenção de usar a educação para conter os conflitos de classe</strong> típicos do primeiro período republicano. A Pedagogia precisava conhecer sua <strong>"matéria-prima"</strong>, as crianças, para <strong>classificá-las</strong> e encaminhá-las a trajetórias escolares diferentes e a <strong>"um exercício estreito de cidadania"</strong>. Daí sua aproximação com uma <strong>psicologia evolutiva normativa</strong>, o peso dos <strong>instrumentos psicométricos</strong> e o uso da <strong>psicanálise em versão adaptativa</strong>, <strong>"gestora de riscos sociais"</strong>, expressão que Patto toma de <strong>Robert Castel</strong>.</p>
<p><strong>Contini (1998)</strong> defende, em sua tese, que o psicólogo na educação atue na perspectiva da <strong>promoção de saúde</strong>. Para sustentar a proposta, ela mostra que historicamente predominou o contrário: <strong>concepções patologizantes</strong>, ligadas à lógica de adaptação e controle. Para Contini, a psicologia aplicada à educação <strong>ajudou a encobrir as reais causas do fracasso escolar</strong>, porque, <strong>com a psicometria, deu respostas individuais a problemas educacionais e sociais</strong>: o fracasso escolar tornou-se <strong>"a doença" da escola</strong>, e o <strong>psicólogo, seu diagnosticador</strong> (Contini, 1998, p. 26).</p>
<blockquote><p>Contini, Bock (1999; 2003) e Patto convergem: a <strong>perspectiva patologizante</strong> nasce de concepções que <strong>tomam o fenômeno psicológico como natural</strong> e fixam <strong>padrões de normalidade</strong> como régua. Exemplo-chave: transformar o fracasso escolar, que é questão educacional e social, em "doença" individual do aluno.</p></blockquote>
<h3>Saúde: psiquiatria, higienização e disciplinarização</h3>
<p>Na saúde, a psicologia chega <strong>junto com a psiquiatria</strong>, e sua marca é ajudar a entender os indivíduos com base em <strong>normalidades adaptativas</strong>. Essa lógica de normalidade e adaptação, que tem como opostos a doença e o desvio, <strong>assenta-se nas noções naturalizantes e individualizantes próprias das concepções liberais</strong>. Antunes mostra que a psicologia <strong>auxiliou a psiquiatria a higienizar e disciplinar a sociedade</strong> e que, ao produzir um saber de <strong>pseudoneutralidade</strong>, ajudou a <strong>reforçar preconceitos e discriminações</strong>. Contini destaca o <strong>caráter disciplinador e curativo</strong> das práticas psicológicas em saúde e a necessidade de acompanhar as propostas mais recentes de <strong>promoção de saúde</strong>.</p>
<h4>O balanço do período</h4>
<blockquote><p><strong>Tese:</strong> nesse período, a ausência da psicologia nas políticas públicas é, <strong>no fundo, uma presença que reforça políticas assistencialistas, patologizantes, curativas e individualizantes</strong>. A psicologia cresce num cenário em que as políticas sociais vêm de um <strong>Estado autoritário e populista</strong> e servem para impor alguma <strong>modernização industrial</strong> garantindo apenas o <strong>mínimo necessário</strong>, algo muito distante do <strong>Estado de bem-estar social</strong> dos países industrializados.</p></blockquote>
<p>A regulamentação da profissão muda alguma coisa? A resposta é <strong>"de certo modo sim"</strong>, por causa da conjuntura histórica em que ocorreu.</p>
<hr>
<h2>1962 e a ditadura: o consultório particular como destino</h2>
<p>Apoiada em Antunes, a autora destaca algo contraintuitivo: a <strong>psicoterapia clínica nos moldes do profissional liberal</strong>, em consultório particular, que passa a dominar depois da regulamentação, <strong>não é o caminho pelo qual a psicologia começa a se inserir socialmente no Brasil</strong>. Ela aparece <strong>por causa da conjuntura econômica e social dos anos 1960</strong> e <strong>de necessidades que surgiram no próprio trabalho da psicologia na saúde, na educação e no trabalho</strong>.</p>
<p>Esse segundo fator liga as duas fases. Como a atuação nessas áreas tinha por diretriz <strong>corrigir rotas desviantes</strong> dos indivíduos, fazia-se necessária uma <strong>intervenção curativa</strong>, capaz de trazê-los de volta à normalidade. Somada às concepções dominantes de <strong>valorização do individualismo</strong>, essa perspectiva nutriu a psicoterapia, que respondia a <strong>dois eixos ideológicos</strong>: o <strong>curativo</strong> e o da <strong>perscrutação da intimidade</strong>.</p>
<blockquote><p><strong>Pegadinha:</strong> a clínica liberal <strong>não é a origem</strong> da psicologia brasileira. A origem é a inserção auxiliar na medicina/psiquiatria, na educação e no trabalho (psicometria). A clínica de consultório é <strong>posterior</strong> e nasce, em parte, para "corrigir" o que essas práticas classificavam como desviante.</p></blockquote>
<h4>A regulamentação e o regime militar</h4>
<p>A profissão é <strong>regulamentada em 1962</strong>, e o contexto deixa sua marca nesse começo. Na época da criação da profissão e nos anos seguintes, sob a <strong>ditadura militar e o "milagre econômico"</strong>, o caminho de <strong>ascensão social</strong> vendido ideologicamente como o mais viável era <strong>formar-se em curso superior e exercer profissão liberal</strong>. Essa valorização ajuda a <strong>expandir o ensino superior privado</strong>. O <strong>golpe de 1964</strong> determina o modelo de desenvolvimento econômico e o modo como as políticas sociais serão (ou deixarão de ser) realizadas.</p>
<p><em>Contexto (não é do texto):</em> o "milagre econômico" foi o período de crescimento acelerado do fim dos anos 1960 e início dos 1970, com forte concentração de renda; a frase "fazer o bolo crescer para depois dividir" é associada à política econômica da época.</p>
<p>A valorização das profissões liberais de nível superior encontra no regime autoritário condições para se expandir por <strong>três razões</strong>:</p>
<ol><li>a via de ascensão oferecida à <strong>classe média</strong> é profissionalizar-se por curso superior;</li><li>o ensino superior cresce, <strong>mas pela iniciativa privada</strong>, porque o <strong>Estado se exime de sua responsabilidade com a educação</strong>;</li><li>há <strong>poucos postos de trabalho nas áreas sociais</strong>, já que as políticas sociais ou são <strong>assistencialistas e tecnocráticas</strong>, o que reduz a demanda por profissionais, ou simplesmente não existem (a lógica de "fazer o bolo crescer" primeiro e só depois dividi-lo).</li></ol>
<p>Assim, o campo de trabalho em saúde, educação e assistência social é pequeno e fica <strong>sobretudo no setor privado</strong>, incluindo o profissional liberal. A maioria dos psicólogos se volta para o <strong>trabalho clínico em consultório particular</strong>; uma parte menor fica em <strong>empresas e escolas</strong>, ainda na tradição da <strong>psicometria</strong> (antes da regulamentação, o saber psicológico mais difundido era a psicometria ou outras formas de descrever e classificar pessoas para organizar a escola e o trabalho). Forma-se um cenário inteiramente favorável àquilo que passou a ser visto como a atuação <strong>"mais específica" da psicologia</strong>: a <strong>psicoterapia em consultório particular, feita por profissional liberal autônomo</strong>, e não as funções secundárias exercidas dentro de outras áreas.</p>
<h4>Expansão dos cursos e formação tecnicista</h4>
<p>Os cursos se multiplicam depressa, <strong>quase todos privados</strong>, e o número de profissionais dispara; com isso, pratica-se a psicologia que já existia, porque a <strong>pesquisa se concentra em poucas instituições, as públicas de excelência</strong>. Por muito tempo, há <strong>simples reprodução de saberes e práticas</strong>, o que mais tarde motivará a <strong>crítica à formação tecnicista</strong>.</p>
<h4>O lugar secundário e a alternativa do consultório</h4>
<p>Todas essas características dão à profissão um lugar <strong>secundário</strong>: um saber que <strong>subsidia outras práticas</strong>, descrevendo e classificando indivíduos em seus "aspectos psicológicos".</p>
<div class="tbl"><table><thead><tr><th>Onde</th><th>O psicólogo...</th></tr></thead><tbody><tr><td>Escola</td><td>auxilia ou complementa o trabalho de professores e pedagogos, apenas nos <strong>"casos-problema"</strong></td></tr><tr><td>Empresa</td><td>subsidia o trabalho do <strong>administrador</strong></td></tr><tr><td>Saúde</td><td>auxilia o <strong>médico psiquiatra</strong></td></tr><tr><td>Justiça</td><td>auxilia o <strong>juiz</strong></td></tr><tr><td>Consultório</td><td>é psicoterapeuta <strong>autônomo</strong>, mas usando o <strong>mesmo conhecimento naturalizante e descontextualizado</strong></td></tr></tbody></table></div>
<p>Se antes a psicologia tinha papel secundário nas instituições, daí em diante ela se desenvolverá <strong>praticamente toda à margem</strong> das políticas sociais, já que qualquer atuação no campo social era <strong>proibida ou rigidamente controlada pelo Estado autoritário</strong>.</p>
<blockquote><p><strong>Síntese crítica do período (cinco traços):</strong> uma psicologia (1) <strong>pretensamente neutra</strong>, que tratava de processos humanos tidos como naturais e universais; (2) que <strong>aplicava</strong> esses conhecimentos sem considerar o contexto sócio-histórico de cada caso nem as subjetividades formadas nessas particularidades; (3) com <strong>formação reprodutora</strong>, portanto <strong>tecnicista</strong>; (4) com <strong>pouca inserção social</strong>, atuando em espaços a que só a <strong>elite e as classes média e média alta</strong> tinham acesso; (5) portanto <strong>longe das necessidades mais amplas</strong> da sociedade brasileira.</p></blockquote>
<hr>
<h2>A presença ausente: a psicologia comunitária brasileira</h2>
<p>Para alguns setores da categoria, esse tipo de inserção sempre pareceu <strong>insuficiente e indesejada</strong>, por estar comprometida com as elites e com a preservação de uma sociedade injusta e desigual. O <strong>descontentamento nasce justamente durante a ditadura militar</strong>. Enquanto a profissão se firmava em meio ao isolamento (regime autoritário, problemas sociais fora da discussão pública, falta de políticas sociais consistentes), uma parte dos psicólogos, <strong>ao lado de outros intelectuais</strong>, começou a criticar a situação do país e o lugar social ocupado pela psicologia.</p>
<p>Para quem desejava uma psicologia que fosse <strong>instrumento de transformação social</strong>, estava claro que nem o tipo de ciência produzido (<strong>neutralidade, naturalização, universalização</strong>) nem os lugares ocupados pelo psicólogo permitiam denunciar a opressão e a desigualdade. E não seria sob um Estado autoritário, que bloqueava políticas sociais amplas, que a psicologia conseguiria levar sua atuação ao setor público. <strong>É nesse cenário que surge a psicologia comunitária no Brasil.</strong></p>
<h4>Diferente da norte-americana</h4>
<p>A psicologia comunitária brasileira tem <strong>caráter diferente</strong> da norte-americana, cuja atuação se dava <strong>em centros comunitários, no marco de práticas assistencialistas</strong>. Aqui, ela foi o lugar onde se construíram <strong>saberes e práticas novos, que recusavam o paradigma hegemônico</strong>: o da neutralidade, das intervenções "técnicas" e do enquadramento dos indivíduos nas instituições sociais conservadoras.</p>
<blockquote><p><strong>Tese:</strong> no Brasil, a psicologia comunitária <strong>articulou uma concepção sócio-histórica da subjetividade a uma prática voltada à emancipação do sujeito</strong>.</p></blockquote>
<h4>Por entre brechas: o acesso pelos movimentos sociais</h4>
<p>Essa psicologia crítica <strong>não tinha um lugar fixo</strong>: crescia <strong>por entre brechas</strong> do contexto histórico. A prática comunitária tinha origem <strong>assistencialista</strong>, como apoio a Estados que precisavam "modernizar" seu trato com populações carentes de auxílio. Na ditadura, porém, ela passou a representar <strong>outra forma de chegar a essas populações</strong>. Em certas áreas, o Estado autoritário mantinha políticas sociais <strong>tecnocráticas e autoritárias</strong>; em outras, simplesmente <strong>não havia política social alguma</strong>. O caminho que os profissionais insatisfeitos encontraram foi <strong>chegar à população por meio dos movimentos sociais</strong>. Para isso, era preciso que os profissionais <strong>estivessem lá e tomassem parte na organização desses movimentos</strong>.</p>
<blockquote><p><strong>Consequência decisiva:</strong> nessas condições, <strong>não havia como participar levando "apenas" um saber "neutro" e "técnico"</strong>. O profissional tinha de definir o objetivo de sua participação e de que modo seu conhecimento serviria às metas buscadas. Para a psicologia, isso significou ter de <strong>construir uma outra psicologia</strong>.</p></blockquote>
<p>Vários autores relatam essa história, e alguns deles a viveram de perto: <strong>Lane (1995, 1996), Freitas (1996), Campos (1996) e Furtado (1998)</strong>. A nova condição exigia <strong>participar de tudo, da construção do próprio campo de atuação à pesquisa e à criação de novos saberes e práticas</strong>.</p>
<h4>As três denominações, segundo Freitas</h4>
<p><strong>Freitas (1996)</strong> mostra que a psicologia comunitária brasileira tem com a norte-americana uma relação <strong>ao mesmo tempo de origem e de ruptura</strong>, e que a própria denominação da área revela seu processo histórico. As fases não são estanques nem independentes:</p>
<div class="tbl"><table><thead><tr><th>Denominação</th><th>Período</th><th>Característica</th></tr></thead><tbody><tr><td>Psicologia <strong>na</strong> comunidade</td><td>décadas de <strong>1960 e 1970</strong></td><td>crise diante dos <strong>modelos importados</strong>, estranhos à realidade do país; proposta de <strong>se deselitizar</strong> e se ligar às condições de vida da população</td></tr><tr><td>Psicologia <strong>da</strong> comunidade</td><td>de cerca de <strong>1985</strong> em diante, com mais força no <strong>início dos anos 1990</strong></td><td>práticas ligadas à <strong>saúde e aos movimentos de saúde</strong>, realizadas por meio de um <strong>órgão prestador de serviços</strong>, a instituição onde o psicólogo trabalhava</td></tr><tr><td>Psicologia <strong>(social) comunitária</strong></td><td>fase seguinte</td><td>usa o <strong>enquadre teórico da psicologia social</strong>, privilegia o <strong>trabalho com grupos</strong>, colabora para a <strong>consciência crítica</strong> e para uma <strong>identidade social e individual</strong> orientada por preceitos eticamente humanos</td></tr></tbody></table></div>
<p>No início, portanto, a psicologia comunitária se formou <strong>em contato direto com a população</strong>, como <strong>saída alternativa diante da impossibilidade de trabalhar no setor público</strong> por outros meios.</p>
<h4>Os dois encontros da Abrapso, segundo Lane</h4>
<p><strong>Lane (1996)</strong> identifica <strong>dois períodos</strong> da psicologia comunitária no Brasil, marcados por <strong>dois encontros da área promovidos pela Abrapso, um em 1981 e outro em 1988</strong>. Os psicólogos envolvidos não se limitavam a atender demandas: <strong>formulavam novos problemas de pesquisa</strong> para a psicologia e procuravam <strong>novos referenciais teóricos e novas práticas</strong>.</p>
<p><em>Contexto (não é do texto):</em> Abrapso é a Associação Brasileira de Psicologia Social, entidade da psicologia social crítica brasileira, da qual Silvia Lane foi uma das fundadoras.</p>
<p>No <strong>encontro de 1981</strong> surgem experiências em <strong>saúde mental</strong> e em <strong>educação popular</strong>: intervenções em <strong>centros comunitários</strong> com um novo enfoque de saúde mental, <strong>alternativa concreta ao modelo psiquiátrico tradicional</strong>; e experiências de educação popular <strong>inspiradas em Paulo Freire</strong>, fora da escola e do ensino formal. Isso é significativo: a psicologia havia crescido <strong>grudada à psiquiatria e à educação</strong>, com práticas tradicionais e adaptativas, e a psicologia comunitária propõe, <strong>nessas mesmas áreas</strong>, alternativas de <strong>ruptura</strong>. Não se tratava apenas de lugares novos, mas dos <strong>lugares possíveis</strong> sob a ditadura, repletos de dificuldades; e eram ensaios ainda tímidos de uma <strong>nova psicologia, com saberes e práticas novos</strong>.</p>
<p>O horizonte dessa nova psicologia sempre foi produzir um conhecimento <strong>ajustado à realidade do país</strong>, capaz de enfrentar seus problemas mais importantes, atender às necessidades da <strong>maioria</strong> e fazê-lo <strong>em favor da emancipação dos indivíduos</strong>, na contramão de políticas <strong>tuteladoras, assistencialistas e autoritárias</strong> e reconhecendo as pessoas como <strong>sujeitos aptos a agir pela própria emancipação</strong>. Não era fácil: a psicologia tinha de <strong>agir e se transformar ao mesmo tempo, mudando tanto o que sabia quanto o que fazia</strong>.</p>
<p>As experiências de 1981 levantaram questões que legitimavam as alternativas e impulsionavam a pesquisa: a relação entre <strong>práticas preventivas e curativas</strong> e <strong>práticas educativas e conscientizadoras</strong>; a relação da psicologia com <strong>outras áreas</strong> (as experiências tinham entrado em campos antes tidos como exclusivos da sociologia, da assistência social e da política); e o <strong>papel das técnicas psicológicas</strong>. Lane critica o que ainda via naquele momento:</p>
<blockquote><p>Lane (1996, p. 23) via ainda um psicólogo <strong>definido pelas técnicas que emprega, e não pelo que conhece do psiquismo humano</strong>, isto é, do indivíduo que se forma nas relações com os outros, nas atividades, no movimento da consciência e na construção da identidade. Era uma <strong>visão fragmentada</strong>, que separava aprendizagem, terapia e conscientização como processos distintos. <strong>O único ponto fixo era a relação grupal</strong>: para Lane, é no encontro com nossos semelhantes que a realidade se revela. Discutiam-se técnicas, e não a natureza do psiquismo.</p></blockquote>
<p>No <strong>encontro de 1988</strong>, Lane vê um <strong>avanço</strong>: compreensão do psiquismo <strong>de maneira integrada</strong>, compreensão da <strong>inserção social do indivíduo</strong> e reconhecimento do <strong>grupo como referência fundamental</strong> para compreender os indivíduos e para a intervenção. Cresce a importância da <strong>leitura sócio-histórica</strong>, já que grande parte do referencial vem do <strong>marxismo e do materialismo histórico-dialético</strong>.</p>
<hr>
<h2>Da comunidade às instituições: redemocratização e Compromisso Social</h2>
<p>Quando passou a ser possível atuar <strong>dentro dos órgãos públicos</strong>, o saber acumulado no trabalho comunitário tornou-se <strong>um dos componentes</strong> de uma nova forma de os psicólogos participarem das políticas sociais. <strong>Não o único</strong>: juntou-se a ele o que a saúde mental elaborou com a <strong>luta antimanicomial</strong>. A procura por formas de atendimento que substituíssem a <strong>internação em manicômios</strong> seguia princípios parecidos: reconhecer a <strong>autonomia e a capacidade de emancipação</strong> das pessoas, mesmo das que têm transtornos mentais ou vivem sofrimento psíquico. Essas práticas fortaleciam visões da psicologia que viam o indivíduo sempre <strong>situado num contexto social de que precisa se apropriar para se emancipar</strong>. Quando essas ações se institucionalizam, principalmente na <strong>saúde pública</strong>, abre-se espaço para um novo tipo de atuação, e a psicologia se aproxima, <strong>por outro caminho</strong>, das políticas públicas <strong>reivindicadas pelos movimentos de saúde</strong>.</p>
<p>Na <strong>educação</strong>, a educação popular, centrada na <strong>conscientização</strong>, forneceu elementos para uma nova leitura da escola, com <strong>intervenções educacionais amplas, em vez de ações pontuais voltadas à "criança-problema"</strong>.</p>
<p>Essas experiências colocam em pauta a <strong>promoção de saúde</strong> e outras noções segundo as quais o indivíduo está inserido num contexto social <strong>construído historicamente e sobre o qual ele pode agir</strong>. A psicologia passa a poder realizar <strong>intervenções "principais", deixando de ser apenas secundária ou instrumental</strong>, inclusive (e sobretudo) em equipes <strong>multidisciplinares</strong>. Mas essas perspectivas <strong>não são as únicas nem hegemônicas</strong>: a psicologia <strong>elitista e adaptadora</strong>, sustentada por um saber naturalizado e naturalizador e por uma formação tecnicista, afastada das políticas públicas, <strong>continuou existindo e existe até hoje</strong>.</p>
<p>O <strong>fim da ditadura</strong> e as lutas pela <strong>democratização</strong> ao mesmo tempo <strong>permitem e exigem</strong> o avanço das perspectivas críticas e impõem novas questões à psicologia.</p>
<h4>A categoria se analisa: a pesquisa do CFP de 1988</h4>
<p>Em paralelo, os psicólogos examinavam a profissão enquanto categoria. Um marco foi a <strong>pesquisa do Conselho Federal de Psicologia feita nos anos 1980 e publicada em 1988</strong>, quando a profissão completava <strong>25 anos de regulamentação</strong>. Muito abrangente, ela confirmou os traços já apontados: <strong>predomínio da clínica em consultório particular, presença reduzida no setor público e valorização de práticas normativas e assistencialistas</strong>.</p>
<p><em>Contexto (não é do texto):</em> o CFP é a autarquia federal que regulamenta e fiscaliza o exercício da profissão de psicólogo, junto com os Conselhos Regionais (CRPs).</p>
<p>Nos vinte anos seguintes, boa parte da categoria procurou <strong>definir um papel próprio para a psicologia diante da realidade brasileira</strong>, deixando de apenas se espelhar na psicologia estrangeira. Os órgãos de representação e de regulamentação reuniram essas discussões e deram <strong>visibilidade ao segmento mais crítico</strong> dos psicólogos, ainda que nem toda a categoria, e às vezes nem a maior parte dela, compartilhasse esse empenho. <strong>Bock (1999)</strong>, ao investigar <strong>como os psicólogos concebem o fenômeno psicológico</strong>, analisa o papel das entidades (<strong>Conselhos Profissionais e Sindicatos</strong>) em organizar e difundir diferentes visões e práticas. Outras publicações do CFP continuaram dando destaque a reflexões sobre o exercício profissional que apontassem caminhos inovadores.</p>
<h4>O Projeto do Compromisso Social</h4>
<p>Nos <strong>anos 1990</strong>, tornou-se evidente que a psicologia, enquanto instituição, <strong>tinha de se reposicionar socialmente</strong>. Para isso era necessário um projeto capaz de articular e organizar a categoria e de influenciar as entidades, a formação e a pesquisa. Ganha corpo então o <strong>"Projeto do Compromisso Social da Psicologia"</strong>, <strong>apoiado na militância e na experiência acumulada nas décadas anteriores</strong>, que reúne um número crescente de psicólogos interessados em qualificar e ampliar as novas práticas e os novos espaços. <strong>Bernardes (2007)</strong>, citada pela autora, aponta: o <strong>claro envolvimento das entidades profissionais</strong> em construir uma psicologia sensível às necessidades do país; o <strong>crescimento do espaço da psicologia no conjunto das profissões de saúde</strong>, o que ajuda a reorientá-las para <strong>práticas preventivas e educacionais</strong>; e uma <strong>nova imagem da psicologia</strong>, fruto da chegada dos psicólogos à <strong>saúde pública</strong> e aos debates sobre suas políticas, que descortina novos campos de trabalho. Com práticas críticas e alternativas, os serviços de psicologia chegam a uma parcela maior da <strong>população carente</strong>, e o <strong>compromisso social vai se tornando o traço distintivo da profissão</strong>.</p>
<p>O projeto reúne primeiro as experiências acumuladas na <strong>saúde mental e na psicologia comunitária</strong>; depois, a <strong>militância em defesa de políticas sociais</strong>, possível com o fim do regime militar. Exemplos: psicólogos engajados nos movimentos pelos direitos de crianças e adolescentes que resultaram no <strong>Estatuto da Criança e do Adolescente (ECA), de 1990</strong>; e nos movimentos que influenciaram a <strong>Constituição de 1988</strong>, que, apesar de suas contradições, é <strong>marco no reconhecimento dos direitos sociais</strong> e da exigência de políticas públicas que os assegurem.</p>
<blockquote><p><strong>Virada:</strong> a democratização do Estado e das instituições, reivindicação da sociedade inteira, torna-se <strong>também condição para o crescimento da profissão</strong>, por dois motivos simultâneos: <strong>abrir campo de trabalho</strong> para profissionais formados em número cada vez maior (o ensino superior continuava se expandindo) e indicar <strong>uma ética de atendimento de toda a população</strong>, em suas necessidades básicas e também nas diversas e de emancipação.</p></blockquote>
<p>O reposicionamento foi marcado por eventos organizados pelo <strong>CFP</strong>, pelos <strong>Conselhos Regionais</strong> e por uma terceira instância, o <strong>Fórum de Entidades Nacionais da Psicologia Brasileira</strong>. Entre eles: <strong>I Mostra Nacional de Práticas em Psicologia (2001, São Paulo)</strong>; o primeiro <strong>Congresso Brasileiro de Psicologia: Ciência e Profissão (2002, São Paulo)</strong>, o I CBP; e o <strong>II CBP (2006, São Paulo)</strong>. Eles deram visibilidade à prática profissional e permitiram uma avaliação crítica dos rumos da psicologia.</p>
<blockquote><p><strong>Os dois eixos do Compromisso Social:</strong> (1) <strong>examinar continuamente práticas e saberes à luz do respeito aos direitos humanos</strong>; (2) <strong>defender que a psicologia esteja presente nas políticas públicas</strong>.</p></blockquote>
<p>Desde a mobilização para que a Constituição reconhecesse os direitos sociais, uma parte expressiva dos psicólogos vem somando, junto com outras categorias, <strong>lutas para que um sistema de garantia de direitos seja de fato implementado</strong>. Hoje a psicologia já aparece <strong>defendendo os direitos de crianças e adolescentes</strong>, o <strong>estatuto do idoso</strong>, a <strong>ampliação da Reforma Psiquiátrica</strong>, o <strong>SUS</strong> (em sua implementação e defesa) e o <strong>Sistema Único de Assistência Social (SUAS)</strong>, e participando dos debates sobre o <strong>sistema prisional</strong> e as <strong>medidas socioeducativas</strong>.</p>
<h4>Por que os direitos humanos</h4>
<p>Orientar essa presença pelos <strong>direitos humanos</strong> é uma <strong>estratégia necessária e apropriada</strong> no contexto contraditório do Brasil pós-ditadura: <strong>afirmação dos direitos sociais diante do neoliberalismo</strong>. A relação do Estado com os cidadãos deve partir da premissa de direitos humanos <strong>universais e inalienáveis</strong>; nas democracias, ninguém contesta isso em teoria, mas é preciso <strong>vigilância permanente</strong>, porque em muitas situações as políticas neoliberais levam a ignorar esses direitos. O saber psicológico pode revelar os efeitos, muitas vezes <strong>sutis</strong>, que a violação de direitos humanos produz nas <strong>vivências subjetivas</strong>, e servir para a <strong>denúncia qualificada</strong> e para a luta pela transformação das situações de violação.</p>
<blockquote><p><strong>Elo entre os dois eixos:</strong> como o <strong>Estado se desobriga</strong> dos direitos sociais, a defesa dos direitos humanos ganha peso decisivo, já que <strong>direitos sociais negados a uma parte da população significam direitos humanos violados</strong>. Defender direitos humanos diz respeito ao <strong>modelo de sociedade desejado</strong>; defender políticas públicas diz respeito ao <strong>compromisso com uma sociedade democrática</strong> que respeita os direitos sociais.</p></blockquote>
<h4>O limite de uma psicologia "bem-intencionada"</h4>
<p>Se as concepções universais e naturalizadas deixaram a psicologia <strong>alheia</strong> às questões urgentes da realidade, as concepções que <strong>desnaturalizam</strong> e mostram a constituição histórica dos fenômenos psicológicos permitem tratar da <strong>subjetividade tal como aparece na vida concreta</strong>, com suas particularidades. Por isso é preciso <strong>admitir os limites de uma psicologia naturalizante, por mais "bem-intencionada" que seja</strong>: muitos atores desejam um novo lugar social para a psicologia, mas ela nem sempre ofereceu os instrumentos necessários para isso.</p>
<blockquote><p><strong>O desafio de hoje:</strong> produzir <strong>conhecimento acerca da dimensão subjetiva da realidade</strong>, mostrando <strong>como essa dimensão se forma dentro da realidade histórica e social e como, por sua vez, ajuda a constituir essa mesma realidade</strong>. Para isso são necessárias concepções que trabalhem com a <strong>historicidade</strong> e identifiquem as <strong>mediações</strong> que constituem os fenômenos, em sua complexidade, movimento e contradições, e as possibilidades de transformá-los.</p></blockquote>
<hr>
<h2>Os seminários do CFP: justificativas, conjuntura e a questão do Estado</h2>
<p>A segunda parte trata da <strong>presença</strong> da psicologia nas políticas públicas, a partir do debate mais público da categoria. O debate não é exclusivo de nenhum grupo, mas a autora reconhece no <strong>CFP</strong> iniciativas importantes e analisa três delas:</p>
<ol><li>os <strong>Seminários Nacionais de Psicologia e Políticas Públicas</strong>;</li><li>o <strong>Banco Social de Serviços em Psicologia</strong>;</li><li>o <strong>Crepop</strong>, sigla do Centro de Referência Técnica em Psicologia e Políticas Públicas.</li></ol>
<p>Esses dispositivos teriam caráter ao mesmo tempo <strong>oficial</strong> (são iniciativas da <strong>autarquia que regulamenta a profissão</strong>), <strong>inovador</strong> (pautados pela <strong>ampla participação da categoria</strong>, num processo democrático em que <strong>referenciais éticos e técnicos são construídos coletivamente</strong>, aceitando o desafio de produzir posturas críticas) e <strong>público</strong> (os procedimentos do CFP supõem <strong>transparência e publicidade</strong> na gestão). Para a autora, eles contribuem para uma <strong>presença presente</strong>.</p>
<h4>Os seminários</h4>
<p>Foram <strong>cinco seminários</strong>: <strong>2001 e 2005 em Salvador, 2003 em João Pessoa, 2007 em Maceió e 2009 em Belém</strong>, sempre articulados ao <strong>Congresso Norte-Nordeste de Psicologia (CONPSI)</strong>. Os debates das <strong>quatro primeiras edições</strong> foram publicados e são o material analisado. <strong>Ressalva</strong> da autora: eles refletem o <strong>segmento da categoria mais organizado e mais próximo do CFP</strong>; ainda assim, trata-se de espaço oficial, democrático e inovador.</p>
<p>A análise se organiza em <strong>cinco itens</strong>: (1) justificativas para os psicólogos discutirem políticas públicas; (2) elementos conjunturais; (3) concepções de políticas públicas; (4) aspectos de como a psicologia se relaciona com as políticas públicas; (5) condições para a participação da psicologia. Observação geral: houve <strong>ampliação da compreensão do tema</strong> e identificação cada vez mais clara das possibilidades da psicologia; a presença de psicólogos em políticas públicas se amplia enquanto a categoria se apropria do campo. Os desafios persistem, mas o <strong>avanço</strong> está em <strong>reconhecer essas questões como problemas</strong> e <strong>criar dispositivos para enfrentá-las coletivamente</strong>.</p>
<h4>Justificativas: do mercado ao projeto ético</h4>
<p>Uma justificativa é <strong>pensar estrategicamente o futuro da profissão</strong>, porque <strong>o modelo do profissional liberal já não se sustenta</strong>: com tantos profissionais novos, abrir campo de trabalho <strong>depende necessariamente das políticas públicas</strong>. Essa justificativa, porém, quase sempre vem junto com uma reflexão que opõe <strong>corporativismo e compromisso ético</strong>. Entende-se que <strong>atuar em políticas públicas é parte da luta para deselitizar a psicologia</strong>, e por isso defender postos de trabalho seria <strong>legítimo, desde que a defesa da profissão esteja associada a um projeto para a sociedade</strong>.</p>
<p>No <strong>I Seminário (2001)</strong>, essas questões eram ainda <strong>incipientes</strong>: os psicólogos <strong>nunca receberam, e ainda não recebem, formação para o trabalho no setor público</strong>; a prática em políticas públicas é <strong>recente</strong> e pede reflexão; também é recente a percepção de que o tema <strong>interessa a todos, e não apenas a quem trabalha no setor público</strong>. Defendia-se que essa reflexão teria efeitos de <strong>transformação social</strong>. A presença da psicologia se afirmava <strong>mais pelo que ela poderia vir a fazer e investigar</strong> do que por <strong>realidades já consolidadas</strong>.</p>
<p>Isso valia até para as áreas mais tradicionais. Na <strong>saúde</strong>, trabalhar no âmbito das políticas públicas pede <strong>outro posicionamento</strong>; vale a pena pensar os problemas de saúde <strong>como necessidades de grupos</strong>, mas a formação nem sempre garante esse olhar, é distante da realidade brasileira, e o <strong>paradigma clínico é uma constante</strong>. A proposta: <strong>manter a clínica, mas ir além da visão individual e incorporar a concepção social</strong>. Na <strong>educação</strong>, constatou-se que os psicólogos trabalhavam segundo o <strong>modelo médico</strong>: o <strong>aluno leva a culpa</strong> pelo fracasso; o objetivo é <strong>ajustar o indivíduo ao sistema</strong>; a <strong>concepção inatista</strong> tem grande força; os currículos reproduzem essas ideias. <strong>Na escola se repete o modelo clínico tradicional, apoiado na concepção liberal de homem.</strong></p>
<p>Essas constatações apontam para a <strong>desconstrução</strong> da intervenção centrada no atendimento individual e na satisfação de necessidades individuais, nos moldes da <strong>"profissão liberal"</strong>, que orientou a psicologia para práticas <strong>normalizadoras e adaptativas</strong>, guiadas pela <strong>lógica da patologia</strong>. Em seu lugar, abre-se a possibilidade de uma <strong>"tecnologia da subjetividade"</strong> voltada a uma intervenção de alcance maior.</p>
<p>Nos seminários de <strong>2003, 2005 e 2007</strong>, as referências ao <strong>Projeto do Compromisso Social</strong> ficam mais explícitas, e as justificativas passam a incluir <strong>o que a leitura psicológica tem de específico</strong>. Surgem falas sobre ligar as políticas públicas à abertura de <strong>novos rumos para a psicologia do país</strong>, como compromisso com a transformação da sociedade; sobre <strong>levar os serviços psicológicos a toda a população</strong>; e sobre o psicólogo atuar <strong>como cidadão</strong>, ao reivindicar direitos, <strong>e como profissional</strong>, ao poder trabalhar para que sejam atendidos. As justificativas passam a vir <strong>da própria psicologia</strong> e de seus saberes, que ajudariam a compreender melhor os fenômenos do campo. Daí a ideia de que as políticas devem ter <strong>"legitimidade subjetiva"</strong>, levando em conta a subjetividade desde sua formulação até sua implementação (por exemplo, nas <strong>questões urbanas</strong>), e de incluir a subjetividade no trato dos <strong>movimentos sociais</strong>.</p>
<blockquote><p><strong>Fórmula para guardar:</strong> <strong>"a política da Psicologia deve ser uma política pública"</strong>. Significa <strong>resistir à tentação de tratar a psicologia como saber privado</strong> e pensar sua relação com o domínio público, porque <strong>só no encontro do saber psicológico com outros saberes a tecnologia da subjetividade pode ser construída e viabilizada</strong>, para uma visão ampla e integral dos fenômenos.</p></blockquote>
<h4>Conjuntura e a pergunta sobre o Estado</h4>
<p>No <strong>I Seminário</strong>, a leitura da conjuntura era ampla: <strong>a falta de saúde de milhões de brasileiros decorre da desigualdade que acompanha a globalização</strong>, uma massa <strong>sem peso econômico, sem organização política</strong> e <strong>sem representação</strong> na luta pelas políticas sociais. Era preciso levar em conta <strong>fatores macroeconômicos, sociais e políticos</strong> como origem das situações que exigem políticas públicas. No <strong>II Seminário (2003)</strong>, houve referências ao <strong>novo governo</strong> e ao desejo de mudança que ele simbolizava; a psicologia deveria aproveitar a ocasião para avançar em seu reposicionamento, rumo ao Compromisso Social. <em>Contexto (não é do texto): 2003 é o início do primeiro governo Lula.</em></p>
<p>Nos seminários seguintes, defende-se o <strong>fortalecimento da democracia também por dentro das instituições</strong>, o que traz desdobramentos para a organização profissional, sobretudo para a <strong>relação da profissão, como categoria, com o Estado</strong>, tema que atravessa todos os debates.</p>
<p>O I Seminário já levanta a questão: com a globalização e a reorientação das políticas sociais, o Estado deve <strong>financiar, prover ou regular?</strong> Financiar e prover, ou apenas regular? Conforme a resposta, muda a forma de defender as políticas públicas. Na <strong>saúde</strong>, os debatedores de 2001 descreveram os anos 1990 como um embate entre construir um <strong>sistema único de saúde, que fosse universal, equitativo, integral, descentralizado e participativo</strong>, e uma <strong>reforma setorial neoliberal</strong> (Estado menor, corte de custos, <strong>descentralização entendida como desresponsabilização</strong> e privatização): <strong>"reforma" e "contrarreforma"</strong> estariam acontecendo simultaneamente. A descentralização ganhou força desde <strong>1998</strong>, mas a <strong>Noas (Norma Operacional de Assistência à Saúde)</strong> separa a atenção básica dos níveis secundário e terciário. E houve <strong>"universalização excludente"</strong>: o <strong>SUS se precarizou</strong> enquanto <strong>os planos de saúde cresciam, até com subsídio estatal</strong>.</p>
<p>Nos seminários seguintes, o Estado é tratado sob <strong>dois ângulos</strong>:</p>
<ul><li><strong>O que demandar ao Estado</strong> (III e IV Seminários): os psicólogos devem se apropriar da discussão sobre o papel do Estado, em diálogo com pesquisadores de outras áreas. Prevalece o entendimento de que <strong>cabe inteiramente ao Estado a responsabilidade pelas políticas públicas</strong>, de que <strong>os mecanismos de controle social são essenciais</strong> e de que os psicólogos precisam <strong>ocupar também as instâncias de controle social</strong>.</li><li><strong>Como a psicologia deve se apresentar ao Estado</strong>: ganha destaque com o <strong>Banco Social de Serviços</strong>.</li></ul>
<h4>O Banco Social de Serviços</h4>
<p>O <strong>Banco Social de Serviços</strong>, projeto do CFP que <strong>começou em 2003 e terminou em 2005</strong>, tinha como meta <strong>apresentar a psicologia ao Estado de maneira organizada</strong>. Partindo do diagnóstico de que, enquanto profissão, a psicologia vinha se mostrando <strong>tímida diante do Estado</strong>, o CFP <strong>financiou projetos de intervenção e os ofereceu a Ministérios e Secretarias Estaduais</strong>, em áreas <strong>onde não havia psicólogos</strong> e/ou que pediam <strong>intervenção urgente</strong>. Quem executou os projetos foram <strong>psicólogos voluntários</strong>, organizados pelo CFP e <strong>supervisionados por especialistas</strong>, para mostrar possibilidades de atuação e a contribuição da psicologia.</p>
<p>O <strong>III Seminário</strong> foi marcado pelas reflexões sobre essa experiência: como conciliar <strong>um projeto corporativo sem cair no corporativismo</strong> com a luta pela garantia dos direitos sociais, um <strong>"espectro ético mais amplo"</strong>. Essa preocupação continuou no IV Seminário e virou um dos eixos do <strong>Crepop, sucessor do Banco Social</strong>: entre os destinatários das referências que o Crepop produz está <strong>o Estado, em particular os gestores públicos</strong> das políticas sociais.</p>
<blockquote><p><strong>Pegadinha:</strong> "corporativo" ≠ "corporativista". O texto não define os dois termos, mas os opõe: o <strong>corporativismo</strong> é contraposto ao <strong>compromisso ético</strong> da profissão, e o projeto <strong>corporativo</strong> legítimo é o que defende a profissão (e seu reconhecimento pelo Estado) <strong>articulado a uma perspectiva para a sociedade</strong>, a luta pela garantia dos direitos sociais, um "espectro ético mais amplo". A fórmula dos seminários: <strong>ser corporativo sem ser corporativista</strong>. E o campo <strong>não é "neutro"</strong>: é <strong>arena de embate político constante</strong>.</p></blockquote>
<p>No <strong>IV Seminário</strong>, volta à cena a desigualdade estrutural da sociedade brasileira, com o alerta de que políticas <strong>"que tratam o país de maneira igual só tendem a manter as desigualdades"</strong>. Por isso é preciso participar da <strong>discussão política em sentido amplo</strong>: estar nos <strong>órgãos de controle social</strong>, na <strong>definição de prioridades</strong> e na <strong>avaliação das políticas</strong> realizadas.</p>
<hr>
<h2>Concepções de políticas públicas e a dimensão subjetiva</h2>
<h4>O que são políticas públicas</h4>
<p>No I Seminário, a definição geral: <strong>políticas públicas são aquelas que asseguram os direitos de cada indivíduo e da coletividade</strong>, como saúde, educação, segurança, habitação, lazer, assistência social e cultura. <strong>O próprio nome já pede posicionamento</strong>: por envolver direitos que precisam ser garantidos, <strong>aponta para o poder público: é direito do cidadão e dever do Estado</strong>.</p>
<p>Os debatedores reconheceram que <strong>é possível haver políticas sociais sem vínculo com o Estado</strong>, mas elas dependem de algum apoio (<strong>ONGs, Igrejas, associações</strong>) e <strong>não podem deixar de lado a discussão e a reivindicação de direitos</strong>, mesmo quando não é o governo que as conduz. Quando partem do governo, porém, <strong>atingem amplitude maior</strong>. A relação com o <strong>terceiro setor</strong> é polêmica: na conjuntura do <strong>"Estado mínimo"</strong>, entrar nas políticas sociais exige tomar posição o tempo todo sobre o papel do poder público, mas não dá para ignorar as ONGs, às quais o próprio Estado recorre. No <strong>II Seminário</strong>, a ênfase foi <strong>assegurar as políticas a partir do Estado</strong>, para cumprir os <strong>princípios constitucionais: direitos garantidos universalmente, gestão democrática, participação dos usuários e controle social</strong>.</p>
<p>Também se apontou que as políticas devem combinar <strong>ações amplas</strong> com <strong>ações pontuais de grande visibilidade, capazes de "mexer com a cidade"</strong>; que os programas devem ser <strong>universais</strong>, <strong>públicos</strong> e <strong>não "de dentro para fora"</strong>. E fica explícito que as políticas sociais <strong>exigem diversos atores</strong> desde a elaboração: o <strong>trabalho multiprofissional e interdisciplinar</strong> é condição para compreender o fenômeno de forma ampla e integral.</p>
<h4>Por área</h4>
<div class="tbl"><table><thead><tr><th>Área</th><th>Concepção debatida</th></tr></thead><tbody><tr><td>Saúde</td><td>tomar como objeto <strong>os determinantes e as condições de vida, não seus resultados</strong>; recuperar <strong>prevenção e promoção de saúde</strong>, não só cura e reabilitação; a promoção inclui <strong>ações inespecíficas</strong> e amplia a própria noção de saúde</td></tr><tr><td>Educação</td><td><strong>democratização da educação</strong>, com três ideias: democratizar <strong>o acesso, o sucesso e a gestão</strong>; acesso universal com qualidade; instrumentos de avaliação para subsidiar ações que diminuam a desigualdade</td></tr><tr><td>Segurança pública</td><td>contraposição entre a concepção do <strong>Estado</strong> (marginalidade e violência como <strong>problemas do indivíduo</strong>, de sua natureza ou de algum desvio → <strong>repressão e/ou cura</strong>) e a que as vê como <strong>produtos de uma estrutura social violenta</strong> → <strong>ações políticas</strong>; segurança como <strong>direito social</strong> (concepção integral, universalidade, responsabilidade do setor público, intersetorialidade), mas com propostas concretas <strong>ainda incipientes</strong></td></tr><tr><td>Política criminal</td><td>base na <strong>Constituição de 1988</strong>, com princípios de <strong>reeducação e reinserção</strong>; na prática, <strong>fracasso</strong>, porque esbarra numa visão secular que localiza as causas do crime <strong>só no criminoso</strong>, perspectiva <strong>individual e a-histórica</strong>; a prisão tem como objetivo real <strong>disciplinar</strong> e perde a função <strong>educativa</strong>; as políticas deveriam apostar na <strong>transformação social e institucional</strong>, não na função punitiva do Estado</td></tr></tbody></table></div>
<p>Nos seminários seguintes, a leitura da dimensão subjetiva vai compondo as concepções de política:</p>
<ul><li><strong>II Seminário</strong>: uma nova concepção de <strong>saúde mental, coerente com a Reforma Psiquiátrica</strong>; atenção à <strong>produção de subjetividade pelos meios de comunicação</strong> (subjetividade nas políticas de comunicação); o vínculo das pessoas com <strong>o espaço urbano</strong> nas políticas de urbanização; segurança e sistema prisional. Começa a ganhar espaço a noção de <strong>sistema de proteção integral</strong> como paradigma, primeiro ligada à <strong>infância e à adolescência</strong> e depois ampliada à <strong>assistência social</strong>.</li><li><strong>III Seminário</strong>: o <strong>trabalho</strong>, nas políticas de geração de renda e emprego; nas políticas de moradia, a <strong>ocupação de territórios por sujeitos que têm história, memória e identidade</strong>.</li><li><strong>IV Seminário</strong>: <strong>ressignificação da noção de cuidado</strong> (o sujeito visto integralmente, como <strong>sujeito de direitos</strong>); <strong>revisão da noção de clínica</strong>, ampliada para uma concepção <strong>social e política</strong>, contra a perspectiva <strong>individualizante e intimista</strong>; novas formas de trabalho além do individual, com novas ferramentas; reconhecimento de que a <strong>leitura psicológica é indispensável</strong> nas políticas voltadas a crianças e adolescentes, ao bem-estar social e à geração de emprego e renda.</li></ul>
<blockquote><p><strong>Síntese:</strong> as políticas públicas sociais precisam ser <strong>saudáveis e humanizadas</strong>, reconhecendo que miram <strong>sujeitos, e não demandas abstratas ou ações formais e padronizadas</strong>. É a perspectiva da <strong>"humanização das políticas públicas"</strong>, entendida como a consideração plena dos sujeitos a que se destinam.</p></blockquote>
<h4>A dimensão subjetiva dos fenômenos sociais</h4>
<p>As concepções <strong>naturalizadas, universalizantes e individualizantes</strong> pouco contribuem para essa perspectiva de sujeito. Uma de suas implicações é o estabelecimento de <strong>dicotomias</strong>, e a mais significativa aqui é a <strong>dicotomia entre indivíduo e sociedade</strong>. Para superá-la, a autora propõe a noção de <strong>dimensão subjetiva</strong> presente nos fenômenos sociais, <strong>apoiada na dialética subjetividade-objetividade</strong>, na linha desnaturalizante da <strong>psicologia sócio-histórica</strong>.</p>
<p>Levar em conta a dimensão subjetiva significa reconhecer, na relação entre indivíduo e contexto social, elementos que se formam <strong>nos dois sentidos</strong>: <strong>elementos subjetivos individuais acabam compondo os fenômenos sociais</strong>; e <strong>elementos objetivos, apropriados pelos indivíduos, acabam compondo sua subjetividade</strong>. Entendida assim, a dimensão subjetiva faz com que as políticas <strong>levem em conta o sujeito a quem se dirigem</strong> e, simultaneamente, <strong>indiquem o campo social</strong> que pretendem transformar.</p>
<blockquote><p><strong>Pegadinha:</strong> dimensão subjetiva <strong>não é</strong> "acrescentar aspectos psicológicos" a uma política, nem olhar só para o indivíduo. É a constituição <strong>recíproca</strong>: o subjetivo constitui o social e o objetivo constitui a subjetividade.</p></blockquote>
<h4>Psicologia, cidadania e escuta</h4>
<p>Outras considerações, já no <strong>I Seminário</strong>: o compromisso com as políticas públicas está ligado à <strong>inserção social do psicólogo enquanto cidadão</strong>; trabalhar com políticas públicas revela um <strong>projeto político</strong>, orientado para <strong>resgatar a cidadania</strong> e estimular a <strong>participação popular</strong>. Diante da necessidade de <strong>"ser coletivo"</strong>, a psicologia oferece <strong>seu olhar e sua escuta para formar cidadãos</strong>: escutar ajuda as pessoas a <strong>se reconhecerem como cidadãs</strong>. Nos seminários seguintes, isso reaparece mais elaborado: a <strong>cidade como espaço de encontro</strong>, a ser pensada com a <strong>categoria afetividade</strong>, que permite enxergar um tipo de <strong>sofrimento coletivo</strong>, o <strong>gerado pelas relações de desigualdade social</strong>; os <strong>meios de comunicação</strong>, que interferem no modo de pensar, de se identificar e de se perceber; e a <strong>educação</strong>, em que os psicólogos <strong>não devem ficar só na teoria</strong> e precisam <strong>participar dos movimentos da área</strong>, articulando, <strong>por meio de projetos, produção de conhecimento, atuação profissional e posicionamento político</strong>.</p>
<p>Em vários campos, a leitura psicológica pode funcionar como <strong>intervenção cultural</strong>: afirmar o <strong>respeito à diversidade</strong>, a <strong>legitimidade das diferentes manifestações subjetivas</strong> e sua relação com experiências e vivências <strong>construídas coletiva e socialmente</strong>.</p>
<blockquote><p><strong>A formulação-síntese dos debates:</strong> <strong>"nas políticas públicas a Psicologia não tem um 'objeto', mas uma perspectiva: a da subjetividade"</strong>.</p></blockquote>
<h4>Posicionamento ético-político e protagonismo</h4>
<p>Essa perspectiva <strong>exige um posicionamento ético-político</strong>: a psicologia não lida com um <strong>terreno neutro</strong>, e sim com um <strong>terreno atravessado por interesses diversos</strong>, onde a direção precisa ser <strong>disputada</strong>. Por isso são fundamentais a <strong>firmeza na leitura própria</strong> e a <strong>abertura para articulações</strong>.</p>
<p>No <strong>I Seminário</strong>, observou-se que a psicologia vem sendo concebida como algo <strong>da esfera privada</strong>: muitas teorias parecem imaginar <strong>um indivíduo solto no mundo</strong>, sem relação com os outros. <strong>Para sobreviver, a psicologia precisa mostrar que tem uma contribuição social a oferecer</strong>; é necessário <strong>ampliar a ideia de política</strong> e entender o espaço político como aquele que permite <strong>ocupar um lugar e decidir que mudanças queremos para o mundo</strong>. Como cidadãos e como psicólogos, estamos num espaço público, e esse é um <strong>compromisso político</strong>. No <strong>II Seminário</strong>, cujo tema era o <strong>protagonismo social do psicólogo</strong>: em que projeto se insere a atuação? Os psicólogos devem <strong>"ocupar a cena"</strong>, ser <strong>coconstrutores das condições em que prestam seus serviços</strong>, engajar-se na luta por políticas públicas e ser protagonistas <strong>pelo viés dos direitos humanos</strong>, também entendidos como <strong>construção histórica</strong>, que podem servir de referência para criticar a sociedade e discutir um projeto alternativo. No <strong>III Seminário</strong>, a experiência do Banco Social mostra isso nos próprios projetos: <strong>há opção na definição de prioridades</strong>.</p>
<hr>
<h2>Condições para a presença e o que mostra o Crepop</h2>
<h4>As condições apontadas nos seminários</h4>
<ul><li><strong>Construção política coletiva e com participação popular</strong>, em diferentes instâncias (<strong>conselhos, orçamento participativo, debates sobre direitos humanos</strong>); daí o <strong>fortalecimento dos mecanismos de controle social</strong> e a <strong>participação organizada da categoria</strong> nesses espaços.</li><li><strong>Articulação com outros profissionais</strong>, apontada em todos os debates: fortalecer os espaços <strong>multiprofissionais e interdisciplinares</strong>, integrar programas <strong>em que todos participam e não há especialistas</strong>, abrir-se para outras áreas, <strong>defender a intersetorialidade</strong> e <strong>atuar em rede</strong>.</li><li><strong>Ruptura com práticas tradicionais</strong>: <strong>inventar novos vínculos</strong> com quem é atendido (pacientes, clientes, usuários); como a realidade é complexa, <strong>olhar só pelo prisma do indivíduo e da clínica não basta para abarcá-la</strong>; compreender os contextos da política e a política mais ampla a que cada atuação se vincula.</li><li><strong>Qualidade da formação</strong>: da crítica a <strong>currículos</strong> que ignoram as demandas das políticas públicas à necessidade de <strong>formação permanente</strong>.</li><li><strong>Condições da conjuntura</strong>: defender o <strong>SUS</strong>, a <strong>participação popular</strong>, a <strong>reforma psiquiátrica</strong> e o trabalho em <strong>equipes multidisciplinares</strong>; e gerar <strong>informação sistematizada</strong> sobre as demandas, as políticas e a presença de psicólogos em cada área.</li></ul>
<p>Para responder a essas necessidades, o <strong>Crepop</strong> foi apresentado no <strong>III e IV Seminários</strong>, com o objetivo de <strong>produzir e divulgar informações</strong> sobre psicologia e políticas públicas e <strong>produzir referências para a prática</strong> dos psicólogos.</p>
<blockquote><p><strong>Tese:</strong> a presença identificada é <strong>processual</strong>, às vezes <strong>polêmica, incipiente ou pouco detalhada</strong>, ainda <strong>em construção</strong>, assim como a ausência da primeira parte era <strong>relativa</strong> e ligada ao contexto. A psicologia acompanha a dinâmica contraditória da sociedade brasileira: ampliação da democracia e dos <strong>sistemas de garantia de direitos</strong> de um lado; <strong>investidas neoliberais</strong>, que apostam no mercado e enfraquecem o Estado, de outro. Em resumo, a tensão entre <strong>sistemas públicos</strong> de um lado e <strong>mercantilização</strong> dos serviços de outro.</p></blockquote>
<h4>O Crepop</h4>
<p>O <strong>Crepop</strong> (Centro de Referência Técnica em Psicologia e Políticas Públicas), lançado em <strong>agosto de 2005</strong>, é uma ferramenta para a categoria ampliar e consolidar sua presença nas políticas públicas. Sua <strong>metodologia</strong> inclui:</p>
<ol><li><strong>mapear a presença dos psicólogos</strong> em programas e projetos de políticas públicas, por meio de <strong>pesquisa on-line, grupos fechados e reuniões abertas</strong>, sob coordenação do <strong>CFP</strong> e execução dos <strong>Conselhos Regionais</strong>;</li><li>levantamento e divulgação dos <strong>marcos legais</strong> das políticas;</li><li><strong>relatórios quantitativos e qualitativos</strong> sobre como os psicólogos estão inseridos;</li><li><strong>identificação de práticas inovadoras</strong>;</li><li><strong>documentos de referência</strong> para a prática.</li></ol>
<p>Os <strong>relatórios qualitativos</strong> talvez tenham <strong>representatividade mais ampla</strong> que os seminários, porque abrangem <strong>psicólogos de todas as regiões do país</strong>, inclusive os que têm <strong>menos acesso aos debates do CFP</strong>. Por isso, quando suas conclusões <strong>coincidem</strong> com as dos seminários, ficam mais claros os aspectos relevantes.</p>
<h4>O que dizem os psicólogos na ponta</h4>
<ul><li><strong>Perspectiva psicossocial ainda é um desafio</strong> diante de práticas centradas no <strong>atendimento individual</strong>. Os limites começam nas <strong>teorias da psicologia</strong>, que os próprios psicólogos identificam como de <strong>viés individualizante</strong>, e aparecem quando é preciso trabalhar com <strong>usuários e suas famílias</strong> (nos <strong>CAPS</strong> e no <strong>sistema prisional</strong>, por exemplo), na perspectiva de ressocialização, integração social e acompanhamento de familiares.</li><li><strong>Articulação da prática com a política geral</strong>: em algumas áreas é mais clara a ideia de uma política de promoção de direitos (por exemplo, <strong>DST/Aids</strong>), e a prática é entendida como parte dela; em outras, não.</li><li>Os psicólogos <strong>criticam as políticas</strong>, mas <strong>reconhecem a necessidade de fortalecer os sistemas de garantia de direitos</strong> (<strong>SUS, SUAS, ECA, Reforma Psiquiátrica</strong>); relatam <strong>falta de condições de trabalho</strong>, políticas que <strong>não abordam o problema em sua complexidade</strong> e <strong>dificuldades de implantação</strong> das diretrizes (medidas socioeducativas de internação, sistema prisional, CAPS, DST/Aids).</li><li>O campo é vivido como <strong>político, não neutro nem meramente técnico</strong>: a presença deve ser <strong>crítica</strong>. Reconhece-se e valoriza-se a <strong>presença da população nas instâncias de controle social</strong>.</li><li>O <strong>trabalho interdisciplinar já é realidade</strong>, mas com dificuldades: reconhecer a necessidade não basta; é preciso <strong>reconhecer o outro, a própria especificidade e seus limites</strong>, e reunir saberes. No nível institucional, o <strong>trabalho intersetorial e em rede</strong> é necessário e difícil.</li><li><strong>Formação</strong>: <strong>currículos defasados</strong>, ensino só das práticas tradicionais.</li><li><strong>Positivo</strong>: <strong>práticas inovadoras "inventadas"</strong> diante das demandas, que exigem <strong>postura flexível</strong> para articular um saber muitas vezes <strong>cristalizado</strong> com uma realidade cheia de situações inusitadas; o <strong>diálogo com outros campos</strong> é um caminho para essa flexibilidade.</li><li>Perspectiva inovadora: a <strong>intervenção cultural</strong>. Práticas que consideram os sujeitos no espaço social e as <strong>vivências coletivas</strong> podem <strong>transformar relações, concepções e vivências de grupos</strong>, apontando, pela promoção de direitos e defesa dos sistemas de proteção social, para uma <strong>sociedade mais justa e solidária</strong>.</li></ul>
<hr>
<h2>Por uma presença crítica: as ferramentas e os oito pontos</h2>
