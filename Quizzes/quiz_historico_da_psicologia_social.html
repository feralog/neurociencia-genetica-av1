<script type="text/html" id="resumoSrc"><h2>Uma disciplina que não nasceu da Psicologia Geral</h2>
<p>Freud abre <em>A psicologia das massas e a análise do eu</em> com uma afirmação que parece dissolver o problema: toda psicologia é social. Sílvia Lane (1933-2006), partindo de um ponto de vista oposto ao dele, chegava à mesma fórmula. Se é assim, o que distingue a Psicologia Social da Psicologia Geral? A resposta não está no objeto — dizer que uma trata do coletivo e a outra do indivíduo é insuficiente, porque a Psicologia Social também estuda o indivíduo o tempo todo.</p>
<p>A resposta está na história. A Psicologia Social <strong>não é um braço da Psicologia Geral</strong>: constituiu-se como disciplina praticamente independente e só foi incorporada à Psicologia quando esta já havia ganhado consistência de ciência autônoma. Guardar isso evita o erro mais comum sobre a origem do campo: ela não é uma especialidade que se destacou de um tronco maior, é um campo com problemas próprios que depois encontrou abrigo.</p>
<blockquote><p>A pergunta que atravessa toda a história da disciplina é sempre a mesma — <strong>como se articulam indivíduo e sociedade?</strong> — e o que muda, de escola para escola, é qual dos dois polos recebe o poder de explicar o outro.</p></blockquote>
<hr>
<h2>Do século XIX a 1908: multidões, povos e o marco fundador</h2>
<p>Os motivos que fizeram nascer os estudos de Psicologia Social são vários e simultâneos. A partir da Revolução Francesa, os <strong>fenômenos de massa</strong> passam a chamar atenção geral, e o episódio da <strong>Comuna de Paris, em 1871</strong>, exigia uma interpretação que os explicasse. Foi o que tentou fazer <strong>Gustave Le Bon</strong> (1841-1931) ao publicar <em>Psicologia das multidões</em>, em <strong>1895</strong>.</p>
<p>A segunda metade do século XIX foi um período revolucionário que reorganizou a geopolítica europeia. É nesse momento que se configura o <strong>Estado-Nação</strong> e surgem as ideias de nacionalidade, de identidade nacional e a noção de país como território tal como a conhecemos. Esse fenômeno está na raiz da <em>Völkerpsychologie</em> — a <strong>Psicologia dos Povos</strong> — do alemão <strong>Wilhelm Wundt</strong> (1832-1920), o mesmo que é considerado o pai da Psicologia. Wundt buscava reconhecer um ente coletivo da cultura, algo que unisse os povos para além da divisão política recém-criada.</p>

<p>Em <strong>1908</strong>, dois livros aparecem no mesmo ano e passam a marcar o início formal da disciplina:</p>
<ul><li><strong>William McDougall</strong> (1871-1938), médico inglês que imigrou para os Estados Unidos e ensinou em Harvard e depois em Duke, lança <em>Uma introdução à psicologia social</em>;</li><li><strong>Edward Alsworth Ross</strong> (1866-1951), sociólogo norte-americano, publica <em>Psicologia Social</em>.</li></ul>
<p>O que os une não é a teoria, e sim o uso: foram os primeiros a empregar <strong>sistematicamente</strong> o termo Psicologia Social para nomear o estudo dos fenômenos presentes na relação indivíduo-sociedade.</p>
<p>Daí em diante, as contribuições se multiplicam e já se dividem. De um lado, os <strong>organicistas</strong> — McDougall entre eles — postulavam que <strong>instintos e comportamentos inatos</strong> explicavam a conduta dos indivíduos em sociedade. De outro, <strong>John Dewey</strong>, <strong>William James</strong> e, mais tarde, <strong>George Herbert Mead</strong> sustentavam o contrário: os comportamentos são <strong>adquiridos e aprendidos</strong> na vida social.</p>

<h2>O capitalismo norte-americano e a matriz cognitivista</h2>
<p>O que consolida definitivamente a disciplina e a inclui no campo da Psicologia não é uma descoberta teórica, é um fenômeno social: <strong>o desenvolvimento do capitalismo nos Estados Unidos</strong>. Ao longo do século XX os EUA se tornam o país mais rico do planeta, o que exige novos saberes sobre meios de produção e consumo. Somam-se a isso o interesse no controle dos trabalhadores de um parque industrial em expansão, a necessidade de compreender a dinâmica dos grupos e a forte imigração de pensadores alemães — muitos judeus — fugidos das condições que produziram as duas Grandes Guerras. Do encontro desses fatores nasce o movimento conhecido como <strong>Psicologia Social Cognitiva</strong>.</p>

s grupos e o controle experimental</figcaption></figure>
<p>Dois nomes organizam essa produção inicial:</p>
<ul><li><strong>Floyd Allport</strong> (1890-1979) lança as bases da <strong>teoria das atitudes</strong>;</li><li><strong>Kurt Lewin</strong> (1890-1947), alemão que imigrou em <strong>1933</strong>, elabora a <strong>teoria dos pequenos grupos</strong>, encerrando o período especulativo dos estudos das massas.</li></ul>
<p>O recorte de Lewin não foi arbitrário: era em pequenos grupos que as pessoas apareciam nas organizações de trabalho, e era esse tamanho que permitia <strong>controle científico dos experimentos</strong>, inclusive em laboratório.</p>
<h4>Cognitivismo: uma fusão</h4>
<p>O Cognitivismo resultou da soma de <strong>aportes comportamentais</strong> desenvolvidos por pesquisadores estadunidenses com a <strong>visão cognitiva da Psicologia da Gestalt</strong>, de inspiração fenomenológica, trazida pelos alemães. A Gestalt centrava-se na consciência e na capacidade de discernimento dos sujeitos. O termo <em>cognitivo</em> se refere ao conhecimento que o sujeito tem da realidade — <em>conhecer</em> vem do latim <em>cognoscere</em>.</p>
<h4>Positivismo e molecularização</h4>
<p>A matriz científica preferencial do período tinha o <strong>Positivismo</strong> como base, e sua principal estratégia era a <strong>molecularização do fenômeno</strong>: quanto menor a parte a ser estudada, melhor o controle científico. A estratégia funcionava na Física, na Química e na Biologia, e aplicá-la a um conhecimento novo, que precisava conquistar respeito acadêmico, pareceu a saída natural.</p>
<blockquote><p>O problema — que só a crise dos anos 1960 explicitaria — é que <strong>o fenômeno humano não se segmenta com a facilidade que se supunha</strong>. Essa crítica é o núcleo de quase tudo o que virá depois.</p></blockquote>
<p>Essa matriz rendeu à Psicologia Social respeito acadêmico, empresarial e governamental, e com ele investimento e crescimento.</p>
<hr>
<h2>O Interacionismo Simbólico e a vertente sociológica</h2>
<p>A alternativa não demorou: foi concomitante, embora de impacto menor no início. <strong>George Herbert Mead</strong> (1863-1931) lecionava na Universidade de Chicago e se apresentava como <strong>behaviorista social</strong>, rótulo escolhido justamente para combater o behaviorismo de <strong>Watson</strong>, o pai do Behaviorismo. Seus livros só foram publicados após sua morte; o mais conhecido, <strong><em>Mind, self and society</strong></em> (<em>Mente, eu e a sociedade</em>, 1934), tornou-se referência para a criação da escola chamada <strong>Interacionismo Simbólico</strong>.</p>
<p>Para Mead e seus seguidores, a constituição do sujeito se dá pela <strong>vertente social</strong>, e a <strong>linguagem é o instrumento central da socialização</strong>. A sociedade é compreendida a partir das interações cotidianas: as pessoas atribuem significados a situações, objetos e relações; esses significados orientam a ação; e podem ser modificados pela própria interação e interpretação.</p>
<h4>O "eu" e o "mim"</h4>
<p>O <em>self</em> divide-se em duas instâncias complementares:</p>
<div class="tbl"><table><thead><tr><th>Instância</th><th>Função</th></tr></thead><tbody><tr><td><strong>"eu"</strong></td><td>Produz o <strong>impulso</strong> para a ação</td></tr><tr><td><strong>"mim"</strong></td><td>Representa a <strong>norma social</strong>; controla e avalia as condições da ação</td></tr></tbody></table></div>
<p>A elaboração do <em>self</em> acontece na relação com o outro até a construção do <strong>outro generalizado</strong>, que é a introjeção das normas sociais e a constituição do "mim" como internalização da norma.</p>

<p>O historiador inglês <strong>Robert Farr</strong> organizou toda essa produção em duas grandes matrizes, e é dessa classificação que emerge a célebre <strong>dicotomia indivíduo-sociedade</strong>.</p>

<p>Uma classificação alternativa foi proposta pelo pesquisador espanhol <strong>Amalio Blanco</strong>, da Universidade Autônoma de Madri, em <em>Cinco tradiciones en la Psicología Social</em>: <strong>grupal, individualista, institucional, lewiniana e histórico-dialética</strong>. O esquema é mais fino, mas tem um custo prático — muitos autores acabam pertencendo a mais de uma tradição —, e por economia a formulação de Farr seguiu sendo a mais usada.</p>
<p>Vale notar que nenhuma das duas matrizes percebia que indivíduo e sociedade são <strong>um mesmo fenômeno visto de pontos de vista distintos</strong>. É exatamente isso que as visões críticas tentarão superar a partir da década de 1960.</p>
<hr>
<h2>Papéis sociais: de Parsons a Goffman</h2>
<p>A visão sociológica afirma o <strong>domínio da exterioridade sobre o indivíduo</strong>. Sua principal inspiração é <strong>Émile Durkheim</strong> (1858-1917), considerado o pai da Sociologia, e sua versão mais completa está na <strong>teoria dos Sistemas Sociais</strong> de <strong>Talcott Parsons</strong> (1902-1979), criador do <strong>Funcionalismo</strong> na Sociologia. É nela que aparece o conceito de <strong>papéis sociais</strong>.</p>
<p>Parsons estudava como os indivíduos se adequam às normas e valores sociais no desempenho dos papéis que assumem — pai, mãe, filho, profissional, religioso. O campo social <strong>prescreve</strong> formas de conduta, com maior ou menor margem de manobra conforme a importância e o controle do papel. A prescrição do desempenho de um <strong>cirurgião</strong> é muito mais controlada que a de um <strong>músico famoso</strong>: do músico se desculpa a vida desregrada em nome do talento; do cirurgião, a mesma conduta é lida como irresponsabilidade.</p>
<p>Nos encontros sociais, usamos <strong>indícios</strong> da posição que cada um ocupa para decidir como tratá-lo — o jaleco branco e o estetoscópio, o terno e a pasta de documentos, o uniforme escolar e a mochila. Tudo o que manifestamos nesses encontros é o <strong>papel desempenhado</strong>, que pode ou não estar de acordo com a prescrição. E ao aprender um papel aprendemos também o <strong>papel complementar</strong>: quem aprende a ser aluno está aprendendo, ao mesmo tempo, o papel do professor.</p>
<h3>Goffman e a linguagem teatral</h3>
<p>O cientista social <strong>Erving Goffman</strong> (1922-1982) publicou em <strong>1959</strong> <em>A representação do eu na vida cotidiana</em> e fez a Teoria dos Papéis avançar com uma <strong>linguagem teatral</strong>. Autor do campo da Antropologia Social, tornou-se referência obrigatória na Psicologia Social.</p>
<ul><li><strong>Palco</strong> — o lugar do desempenho formal dos papéis, diante de uma plateia nem sempre amigável.</li><li><strong>Bastidores</strong> — a intimidade resguardada na família, nos amigos íntimos, nas relações afetivas; o mais íntimo dos bastidores é a <strong>própria consciência</strong>.</li><li><strong>Impressão</strong> — as pessoas querem causar determinada impressão e usam tudo ao alcance para isso: roupas, conversa, assuntos, objetos pessoais. Causada a impressão, é preciso <strong>mantê-la</strong>.</li></ul>
<p>Os recursos dessa encenação estão disponíveis no <strong>repertório cultural</strong> e são de conhecimento geral — inclusive dos interlocutores, que formarão sua própria impressão, mais próxima ou mais distante da intenção. Pense numa seleção de emprego feita em grupo: todos cordiais, todos disputando a mesma vaga, cada gesto medido e avaliado.</p>
<p>Duas obras posteriores completam o quadro:</p>
<ul><li><strong><em>Manicômios, prisões e conventos</strong></em> (<strong>1961</strong>) — análise das <strong>instituições totais</strong>, aquelas que abarcam toda a vida de uma pessoa; a análise alimentou as críticas a prisões e hospitais psiquiátricos.</li><li><strong><em>Estigma</strong></em> (<strong>1963</strong>) — o processo de estigmatização como <strong>manipulação das identidades deterioradas</strong>.</li></ul>
<blockquote><p>Goffman deu forma e nome ao <strong>controle social</strong>, mas não escapou da dicotomia: de um lado o sujeito, de outro uma sociedade com regras e modelos de conduta. Há nele uma <strong>naturalização da pressão social</strong> e da tarefa de controlar impressões — como se fossem fatos da natureza, e não produções históricas.</p></blockquote>
<hr>
<h2>Percepção, atitudes e socialização: os conceitos da vertente psicológica</h2>
<p>A teoria cognitivista sustentava algo simples e forte: a pressão social, os papéis e as expectativas <strong>não teriam nenhuma influência sobre os indivíduos se eles não as percebessem</strong>. Daí a centralidade da <strong>cognição</strong>, definida como a organização estruturada e significativa que o sujeito faz a partir de suas percepções e das influências que recebe do meio.</p>

<p>Percebemos não só a presença do outro, mas o conjunto de características que ele apresenta, e isso nos permite <strong>produzir uma impressão</strong> sobre a pessoa. A impressão é possível porque nossos contatos com o mundo vão sendo organizados em um <strong>repertório cognitivo</strong> — a organização do conhecimento no nível da consciência —, e é ele que permite compreender e <strong>categorizar</strong> um fato novo.</p>
<blockquote><p><strong>Percepção</strong> é o processo que vai da <strong>recepção do estímulo pelos órgãos do sentido</strong> até a <strong>atribuição de significado</strong> a esse estímulo. Experiência de vida → repertório cognitivo → compreensão e categorização.</p></blockquote>
<h3>Comunicação</h3>
<p>Quando percebemos, já teve início a comunicação: um processo de <strong>codificação</strong> (formação de um sistema de códigos) e <strong>decodificação</strong> (esforço de entender a codificação) de mensagens, que não se limita ao código verbal — inclui expressões do rosto, gestos, movimentos, desenhos e sinais. A partir desse esquema básico, a Psicologia Social estudou influência, persuasão e interdependência entre quem se comunica.</p>

<p>A partir da percepção do meio e dos outros, o indivíduo organiza informações, associa-as a <strong>afetos</strong> (positivos ou negativos) e desenvolve uma <strong>predisposição para agir</strong>. A esse conjunto se dá o nome de <strong>atitude</strong>. Um cuidado terminológico que costuma ser cobrado: para a Psicologia Social, ao contrário do senso comum, <strong>não se "toma" atitude</strong> (que seria comportamento) — <strong>desenvolve-se</strong> atitude (crenças, valores, opiniões) em relação aos objetos do meio social.</p>
<p>Os três componentes — <strong>informação, afeto e predisposição para a ação</strong> — tendem a ser <strong>congruentes</strong> entre si: informação positiva puxa afeto positivo, e ambos puxam comportamento favorável. É essa congruência que dá certa <strong>regularidade</strong> à nossa relação com o meio, e é por isso que atitudes são boas preditoras de comportamento — ainda que não infalíveis, já que a situação concreta pode alterar o comportamento previsto.</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Atitude</strong></th><th><strong>Opinião</strong></th></tr></thead><tbody><tr><td>Estabilidade</td><td>Duradoura, difícil de mudar</td><td>Não necessariamente duradoura</td></tr><tr><td>Afeto</td><td>Envolve carga afetiva</td><td>Em geral não envolve afeto</td></tr><tr><td>Diante de informação dissonante</td><td>Tende a <strong>se manter</strong></td><td>Tende a <strong>mudar</strong></td></tr><tr><td>Exemplos</td><td>Torcer por um time, professar crença religiosa ou política</td><td>Preferir um sabor de sorvete ou um refrigerante</td></tr></tbody></table></div>
<p>Publicitários exploram exatamente essa diferença: questionam a <strong>opinião</strong> sobre o produto concorrente com informação nova e, ao mesmo tempo, associam a marca a <strong>atitudes</strong> socialmente valorizadas — o refrigerante das pessoas ativas e dinâmicas, dito por um esportista jovem e admirado.</p>
<h4>Mudança de atitude e dissonância cognitiva</h4>
<p>Atitudes mudam por novas informações, novos afetos ou novos comportamentos. Um caso particular é ser <strong>obrigado a agir em desacordo com a própria atitude</strong>: a tensão resultante é a <strong>dissonância cognitiva</strong>, nomeada por <strong>Leon Festinger</strong> (1919-1989) em <strong>1957</strong>, teoria de enorme impacto no período experimental. Quem não gosta de certos vizinhos e passa a estudar com eles tende a descobrir neles qualidades — bons alunos, populares — que permitem a aproximação e a mudança de atitude, evitando o conflito permanente. Ampliado, o mesmo mecanismo aparece em conflitos entre católicos e protestantes na Irlanda do Norte, nos conflitos raciais do sul dos Estados Unidos, no fim do <em>apartheid</em> na África do Sul e na política de cotas nas universidades brasileiras — situações em que mudar uma atitude preconceituosa é vital e nada fácil.</p>
<h3>Socialização e grupos</h3>
<p>De onde vêm crenças, valores e significações? Do processo de <strong>socialização</strong>, pelo qual o indivíduo se torna membro de um conjunto social, aprende seus códigos de conduta, normas e regras, e se apropria dos conhecimentos acumulados por aquela cultura. <strong>Berger e Luckmann</strong> distinguem:</p>
<ul><li><strong>Socialização primária</strong> — a mais importante, realizada pela <strong>família</strong> e pelas instituições mais tradicionais (escola, igreja, grupos de referência). Nela se fixam os valores mais básicos, como os que definem gênero: o enfeite azul ou rosa na porta do quarto da maternidade já é uma escolha simbólica que se converterá em controle do comportamento.</li><li><strong>Socialização secundária</strong> — a <strong>escolha autônoma</strong> feita pelo sujeito dentro do que sua cultura franqueia, como a escolha profissional. Em sociedades tradicionais, como a dos Maoris da Nova Zelândia, essa margem é bem mais estreita.</li></ul>
<p>Entre o conjunto social amplo e o indivíduo estão os <strong>grupos sociais</strong>: conjuntos de pessoas com objetivos comuns, dotados de normas, formas de pressão para que os membros se conformem, tarefas e funções distribuídas, mecanismos de cooperação e de competição, e atrativos que impedem o abandono — mas que não hesitam em <strong>expulsar</strong> quem rompe com as normas internas.</p>

<h2>A crise da Psicologia Social e suas alternativas</h2>
<p>No fim dos anos 1960 o mundo vive transformações profundas e contraditórias, e uma disciplina que estuda o indivíduo em sociedade não passaria incólume.</p>
<ul><li>A <strong>contracultura</strong> e o movimento hippie, nascidos nos EUA e espalhados pelo mundo, colocam os jovens à frente de uma mudança de valores e questionam a família tradicional e seus costumes.</li><li>O recrudescimento da <strong>Guerra Fria</strong>, com a tentativa de invasão da <strong>Baía dos Porcos</strong> em <strong>1961</strong> e a reação soviética, faz surgir o temor concreto de uma guerra atômica. O maior controle norte-americano sobre sua área de influência leva à instalação de <strong>ditaduras militares</strong> em toda a América Latina.</li><li>Em <strong>1968</strong>, estudantes e operários franceses levantam barricadas nas ruas de Paris. <strong>Jean-Paul Sartre</strong> está entre os intelectuais que aderem, e a ocupação prolongada das universidades francesas abre um longo período de reflexão. No Brasil, as manifestações eram contra a Ditadura Militar.</li></ul>
<p>No início dos anos 1970, a <strong>Psicologia Social psicológica</strong> passa a ser duramente criticada em seu próprio território por conta de sua perspectiva individualista. O filósofo alemão <strong>Herbert Marcuse</strong>, expoente da <strong>Escola de Frankfurt</strong>, influenciava fortemente a juventude norte-americana com seus livros críticos. A crise empurra pesquisadores nos Estados Unidos, na França e na América Latina a formular alternativas para uma Psicologia Social mais comprometida com a realidade.</p>
<h3>As quatro críticas centrais</h3>
<blockquote><p><strong>a)</strong> É uma Psicologia Social de <strong>método descritivo</strong> — descreve o observável e o factual, dando nome aos processos dos encontros sociais, sem explicá-los historicamente. <strong>b)</strong> Seu desenvolvimento está <strong>comprometido com os objetivos da sociedade norte-americana do pós-guerra</strong>, que precisava de resultados imediatos para recuperar a nação e aumentar a produtividade. Não por acaso os temas mais desenvolvidos foram comunicação persuasiva, mudança de atitudes e dinâmica de grupo — fórmulas de ajustamento do comportamento individual ao contexto social. <strong>c)</strong> Parte de uma <strong>noção estreita do social</strong>, reduzido à interação entre pessoas, e não tomado como o conjunto de produções humanas que, ao construir a realidade social, constroem também o indivíduo. <strong>d)</strong> Está assentada na <strong>dicotomia</strong>, separando indivíduo e sociedade como se um pudesse existir sem o outro, e privilegiando um dos polos.</p></blockquote>
<h3>Alternativas construídas na Europa</h3>
<ul><li><strong>Movimento institucionalista</strong> — antes mesmo da crise, na França e na Inglaterra, um grupo de intelectuais critica as velhas formas de tratamento nos hospitais psiquiátricos e o caráter conservador das instituições, lançando as bases da <strong>Análise Institucional</strong>, com influências da Psicanálise e do marxismo. A <strong>publicação coletiva de 1962</strong> reuniu <strong>Edgar Morin, Georges Lapassade, Robert e Max Pagès e Serge Moscovici</strong>, entre outros; traduzida para o espanhol, recebeu o nome de <em>Psicologia Social e compromisso político</em>.</li><li><strong>Construcionismo Social</strong> — em <strong>1973</strong>, o psicólogo social estadunidense <strong>Kenneth Gergen</strong> lança suas bases, e por ser em solo norte-americano o impacto sobre a vertente experimental foi especialmente forte. Gergen chama de "velhas correntes" tanto a matriz psicológica quanto a sociológica. Em <strong><em>O eu saturado</strong></em> (<strong>1991</strong>) analisa o efeito das novas tecnologias e do ritmo de vida sobre a constituição do eu, criticando uma Psicologia Social que partia o sujeito em pedaços — atitudes, atribuições, preconceito, socialização, grupos — e deslocando o foco do indivíduo para o <strong>sujeito das relações sociais</strong> e para as formas de produção de sentido.</li><li><strong>Representações Sociais</strong> — <strong>Serge Moscovici</strong> (1925-2014), francês de origem romena, parte em <strong>1961</strong> de sua pesquisa sobre a representação social da Psicanálise na França e retoma as noções durkheimianas de <strong>representação coletiva</strong> e <strong>consciência coletiva</strong>, propondo uma nova interpretação de como as pessoas, coletivamente, constroem sua percepção do mundo e elaboram teorias sobre a realidade vivida. Publicou <em>Psicologia das minorias ativas</em> (1976), sobre a influência dos grupos minoritários na opinião pública, e em 1984 organizou um manual que ainda é referência. Após sua morte, <strong>Denise Jodelet</strong> assumiu o laboratório que ele criara em Paris e publicou, em <strong>2015</strong>, <em>Représentations sociales et mondes de vie</em>, com uma definição que trata as representações <strong>ao mesmo tempo no plano individual e no coletivo</strong> — buscando justamente acabar com a separação entre o psicológico e o sociológico.</li></ul>
<h3>O novo objeto</h3>
<p>A nova Psicologia Social mantém a relação indivíduo-sociedade como questão básica, mas toma por objeto, na formulação de <strong>Gonçalves e Bock</strong>, a <strong>dimensão subjetiva dos fenômenos sociais</strong>. Interessa compreender como violência, preconceito, relações de gênero, exclusão, desigualdade, movimentos sociais e processos políticos são <strong>sentidos, percebidos, simbolizados — e por vezes distorcidos e naturalizados</strong> — pelos sujeitos e pelos coletivos a que pertencem, sempre considerando as condições objetivas que os produzem. Seguindo <strong>Norbert Elias</strong>, pode-se chamar de <strong>processo civilizador</strong> a resultante histórica desse conjunto de costumes, regras e modos de percebê-las.</p>
<p>O caso da <strong>desigualdade social brasileira</strong> ilustra bem: além dos dados de concentração de renda, há uma produção de significados que faz a desigualdade parecer natural — "sempre foi assim", "há os que se esforçam e os que não se esforçam". Essas construções são a dimensão subjetiva do fenômeno, e portanto objeto de trabalho da Psicologia Social.</p>
<hr>
<h2>O Brasil sócio-histórico e a Psicologia da Libertação</h2>
<h3>Sílvia Lane e a Psicologia Social sócio-histórica</h3>
<p>No Brasil, a renovação crítica da disciplina é indissociável de <strong>Sílvia Lane</strong> (1933-2006). Apoiada em <strong>Lev Vigotski, Alexis Leontiev e Alexander Luria</strong> e nos estudos sobre linguagem, e a partir de um longo trabalho de intervenção e análise no <strong>Programa de Pós-Graduação em Psicologia Social da PUC-SP — o primeiro do país, criado em 1972</strong> —, Lane construiu uma crítica detalhada da Psicologia Social tradicional. Com <strong>Wanderley Codo</strong> organizou <strong><em>Psicologia social: o homem em movimento</strong></em>, marco dessa virada.</p>
<p>Três categorias sustentam a construção:</p>
<ul><li><strong>Atividade</strong> — unidade básica da vida do sujeito material; é pela atividade que o ser humano se apropria do mundo e se dá a transição do que está fora para dentro do psiquismo. A prática humana é a base do conhecimento e do pensamento.</li><li><strong>Consciência</strong> — a forma como o ser humano se relaciona com o mundo objetivo. Não é predeterminada nem preexistente: constitui-se na atividade concreta, na linguagem e nas relações sociais, e não se limita ao saber lógico — inclui emoções, sentimentos, desejos e o saber inconsciente. Por volta dos dois anos, a aquisição da linguagem produz o salto que permite integrar e organizar experiências; a partir dos três, com a <strong>linguagem interior</strong>, a criança adquire a noção de sujeito.</li><li><strong>Identidade</strong> — se o mundo e a consciência estão em movimento, a consciência de si também está. <strong>Antônio da Costa Ciampa</strong>, colaborador de Lane, formulou a <strong>identidade como metamorfose</strong>: ela deixa de ser algo estático e acabado para ser um processo contínuo de representações do "estar sendo" no mundo. A categoria supera a leitura do ser humano como soma de papéis, valores, habilidades e atitudes, buscando captar sua <strong>singularidade</strong>, produzida no confronto com o outro.</li></ul>
<h3>Sofrimento ético-político e humilhação social</h3>
<ul><li><strong>Bader Sawaia</strong>, com base em autores como <strong>Espinosa</strong> e <strong>Vigotski</strong>, formulou o conceito de <strong>sofrimento ético-político</strong> para nomear a vivência cotidiana das questões sociais dominantes — especialmente <strong>a dor de ser tratado como inferior, subalterno, sem valor, apêndice inútil da sociedade</strong>. Esse sofrimento <strong>retira potência</strong> das pessoas, e cabe ao psicólogo analisá-lo e denunciá-lo, contribuindo para potencializar os sujeitos como protagonistas da cena social. Sua principal obra sobre o tema é <em>As artimanhas da exclusão</em> (2011).</li><li><strong>José Moura Gonçalves Filho</strong>, do Instituto de Psicologia da USP, trabalha com a noção de <strong>humilhação social</strong> a partir da <strong>Fenomenologia</strong>. A humilhação crônica, longamente sofrida pelos pobres e seus ancestrais, é efeito da <strong>desigualdade política</strong> e indica a exclusão recorrente de toda uma classe do âmbito da iniciativa e da palavra. Ele a propõe como uma <strong>modalidade de angústia</strong> disparada pelo enigma da desigualdade de classe — fenômeno ao mesmo tempo psicológico e político, reconhecível no corpo, no gesto, na imaginação e na voz do humilhado, e também em seu trabalho e em seu bairro.</li></ul>
<p>Os dois conceitos são instrumentos analíticos para as situações de exclusão e desigualdade, e ambos se referem à dimensão subjetiva da vida precária.</p>
<h3>A América Latina e Martín-Baró</h3>
<p>A Psicologia Social latino-americana carrega uma tensão característica: busca de autonomia e, ao mesmo tempo, reprodução de modelos importados. O mexicano <strong>Rolando Díaz-Loving</strong> — filho de <strong>Rogelio Díaz-Guerrero</strong> (1918-2004), pioneiro da área no México — avalia que a combinação entre uma modernidade em curso e traços de sociedade tradicional (a herança indígena, a presença decisiva do negro na formação da identidade) induz entre nós estudos sobre <strong>identidade social, gênero, sexualidade, igualdade e desigualdade, comunicação de massa e política</strong>.</p>
<p>O nome maior da alternativa é <strong>Ignácio Martín-Baró</strong> (1942-1989), padre jesuíta espanhol radicado em El Salvador, vice-reitor da Universidade Centro-Americana José Simeón Cañas e <strong>brutalmente assassinado por forças paramilitares de direita</strong> durante o conflito civil. A partir de um estudo minucioso da matriz estadunidense, construiu um novo paradigma voltado à compreensão do modo de vida, da identidade e das características sociais da população salvadorenha, generalizando com cuidado para toda a América Latina. Sua visão crítica desmontou mitos como o do <strong>salvadorenho pobre, alegre e preguiçoso</strong>, reconhecendo-o como <strong>dominado</strong>.</p>
<blockquote><p>Martín-Baró é o criador da <strong>Psicologia da Libertação</strong>, com inspiração declarada na <strong>Teologia da Libertação</strong>, e aponta como influências o educador brasileiro <strong>Paulo Freire</strong> (1921-1997) e o sociólogo colombiano <strong>Orlando Fals-Borda</strong> (1925-2008). Entre seus interlocutores críticos estavam a brasileira <strong>Silvia Lane</strong>, a venezuelana <strong>Maritza Montero</strong> e o cubano <strong>Fernando González-Rey</strong>.</p></blockquote>
<div class="tbl"><table><thead><tr><th></th><th><strong>Matriz norte-americana</strong></th><th><strong>Alternativa latino-americana</strong></th></tr></thead><tbody><tr><td>Contexto de origem</td><td>Capitalismo em expansão, pós-guerra, Guerra Fria</td><td>Ditaduras, desigualdade, dominação e conflito civil</td></tr><tr><td>Objetivo prático</td><td>Ajustar o comportamento individual ao contexto social</td><td>Emancipar e potencializar sujeitos e coletivos</td></tr><tr><td>Concepção de sujeito</td><td>Indivíduo que percebe, avalia e se adapta</td><td>Sujeito histórico, dominado, capaz de transformar-se</td></tr><tr><td>Método preferencial</td><td>Experimental e laboratorial</td><td>Participativo, comprometido, ligado à comunidade</td></tr><tr><td>Nomes de referência</td><td>Allport, Lewin, Festinger, Parsons, Goffman</td><td>Martín-Baró, Silvia Lane, Ciampa, Sawaia, Montero</td></tr></tbody></table></div>
<p>Com esse percurso, a Psicologia Social passou a ser reconhecida como <strong>especialidade da profissão</strong> no Brasil (Resolução CFP n. 05/2003, depois substituída pela 13/2007), definida como atuação fundamentada na compreensão da dimensão subjetiva dos fenômenos sociais e coletivos, com o objetivo de problematizar e propor ações no âmbito social — em saúde, educação, trabalho, justiça, assistência social e junto a movimentos sociais.</p>
<hr>
<h2>Fechando o eixo: da dicotomia à dimensão subjetiva</h2>
<p>Se for preciso guardar uma única linha de raciocínio, guarde esta. A Psicologia Social nasce tentando explicar <strong>multidões</strong> e termina o século XX tentando explicar <strong>subjetividades produzidas socialmente</strong>. Entre um ponto e outro, ela passa por uma matriz <strong>psicológica</strong>, que coloca o poder explicativo no indivíduo que percebe, e por uma matriz <strong>sociológica</strong>, que o coloca na exterioridade que prescreve — e ambas, sem perceber, mantêm indivíduo e sociedade como <strong>duas coisas separadas</strong>.</p>
<blockquote><p>A <strong>crise</strong> dos anos 1960-70 é o momento em que essa separação deixa de ser um detalhe técnico e passa a ser lida como um <strong>problema político</strong>: uma ciência que descreve o encontro entre um sujeito pronto e uma sociedade pronta acaba, na prática, produzindo fórmulas de ajustamento. A saída não foi escolher um polo, e sim mudar o objeto — da interação para a <strong>dimensão subjetiva dos fenômenos sociais</strong>, na qual o sujeito age sobre o mundo, transforma-o e, ao fazê-lo, transforma a si mesmo.</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

function renderHeader(){
  var mono = "font-family:'IBM Plex Mono',monospace";

    '<div style="min-width:0">' +

        '<span style="color:#d3cec4">/</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(EYEBROW)+'</span>' +
      '</div>' +
      '<h1 style="margin:1px 0 0;font-family:\'Newsreader\',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.15">'+esc(TITLE)+'</h1>' +
    '</div>';

  var right = '';

    var hit = counts().hit;
    right = '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0">' +
              '<button type="button" data-act="sair" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:9px;padding:6px 11px;'+mono+';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">Sair</button>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="'+mono+';font-size:15px;font-weight:600;letter-spacing:-.02em">'+hit+'</span>' +
                '<span style="'+mono+';font-size:11px;color:#8a8578">/ '+S.order.length+'</span>' +
              '</div></div>';
  } else if (S.view !== 'home') {
    right = '<button type="button" data-act="home" class="h-line" style="flex-shrink:0;background:none;border:1px solid #ddd8ce;border-radius:9px;padding:7px 13px;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;transition:border-color .15s ease">← Início</button>';
  }

  var html = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:'+(S.view==='quiz'&&S.started?'10px':'2px')+'">'+left+right+'</div>';

  if (S.view === 'quiz' && S.started) {
    var c = counts();
    var rail = S.order.map(function(q,n){
      var a = S.answers[n], cur = n===S.i && !S.finished, bg = '#d3cec4';
      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';
      if (cur && a===null) bg = '#121a2b';
      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +
             '<span style="display:block;width:100%;border-radius:99px;transition:height .18s ease,background .18s ease,box-shadow .18s ease;height:'+(cur?'17px':'9px')+';background:'+bg+';box-shadow:'+(cur?'0 0 0 3px rgba(18,26,43,.13)':'none')+'"></span></button>';
    }).join('');
    html += '<div><div style="display:flex;align-items:center;gap:3px">'+rail+'</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-2px">' +
              '<div style="'+mono+';font-size:11px;letter-spacing:.04em;color:#5b6478">Questão '+pad(S.i+1)+' / '+S.order.length+'</div>' +
              '<div style="display:flex;align-items:center;gap:12px;'+mono+';font-size:10.5px;color:#8a8578">' +
                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;
}
function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

function figura(q, cls){
  if (!q.image) return '';
  return '<figure class="fig'+(cls?' '+cls:'')+'"><img src="'+q.image+'" alt="'+esc(q.imageCaption||'Imagem da questão')+'">' +
         (q.imageCaption ? '<figcaption>'+esc(q.imageCaption)+'</figcaption>' : '') + '</figure>';

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }
      if (isMine && !isC)    { bd='#e0a49a'; bg='#fdf0ee'; fg='#8f2f25'; bBg='#c04437'; bFg='#fff'; mark='✕'; mColor='#c04437'; }
    } else if (isMine)       { bd='#121a2b'; bg='#f7f6f2'; bBg='#121a2b'; bFg='#f5f3ef'; }
    var locked = reveal && LOCK;
    return '<button type="button" data-act="pick" data-n="'+n+'" class="h-opt'+(locked?' locked':'')+'" style="--hbd:'+hbd+';display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 15px;border-radius:13px;font-size:15px;line-height:1.5;transition:border-color .15s ease,background .15s ease,transform .12s ease;border:1.5px solid '+bd+';background:'+bg+';color:'+fg+';cursor:'+(locked?'default':'pointer')+';opacity:'+op+'">' +
      '<span style="flex-shrink:0;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;'+mono+';font-size:11.5px;font-weight:600;margin-top:1px;background:'+bBg+';color:'+bFg+'">'+LETTERS[n]+'</span>' +
      '<span style="flex:1;min-width:0;text-wrap:pretty">'+esc(text)+'</span>' +
      (mark ? '<span style="flex-shrink:0;'+mono+';font-size:14px;font-weight:600;margin-top:1px;color:'+mColor+'">'+mark+'</span>' : '') +
      '</button>';
  }).join('');

  var expl = reveal ? '<div style="margin-top:20px;padding:16px 18px;background:#f7f6f2;border-left:2.5px solid #2b57cc;border-radius:0 12px 12px 0;animation:qFade .26s ease">' +
      '<div style="'+mono+';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc;margin-bottom:8px">Por quê</div>' +
      '<p style="margin:0;font-size:14.5px;line-height:1.68;color:#39404f;text-wrap:pretty">'+esc(q.explanation)+'</p></div>' : '';

  var blank = counts().blank;
  var warn = S.warn ? '<div style="margin-top:14px;padding:15px 17px;background:#fdf7e9;border:1px solid #e8d5a3;border-radius:14px;animation:qFade .22s ease">' +
      '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#6b5620">'+blank+(blank===1?' questão ainda está em branco.':' questões ainda estão em branco.')+' Você pode voltar nelas ou finalizar assim mesmo.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button type="button" data-act="gotoBlank" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer">Ir para a 1ª em branco</button>' +
        '<button type="button" data-act="force" style="background:none;color:#6b5620;border:1px solid #e8d5a3;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer">Finalizar assim mesmo</button>' +
      '</div></div>' : '';

  var last = S.i === S.order.length-1;
  var early = !last && (S.order.length - blank) > 0;

  document.getElementById('stage').innerHTML =
    '<section style="padding:26px 0 0">' +
      '<article style="background:#fff;border:1px solid #e4e0d8;border-radius:18px;padding:26px 22px 24px;box-shadow:0 1px 2px rgba(18,26,43,.04),0 12px 28px -18px rgba(18,26,43,.18)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#2b57cc">Questão '+pad(S.i+1)+'</div>' +
          '<div style="'+mono+';font-size:10.5px;letter-spacing:.06em;color:'+sColor+'">'+status+'</div>' +
        '</div>' +
        '<h2 style="font-family:\'Newsreader\',Georgia,serif;font-size:22px;line-height:1.42;font-weight:400;letter-spacing:-.012em;margin:0 0 22px;text-wrap:pretty">'+esc(q.question)+'</h2>' +
        figura(q, 'qfig') +
        '<div style="display:flex;flex-direction:column;gap:9px">'+opts+'</div>' + expl +
        (reveal ? chatBox(q, ans===q.correctIndex) : '') +
      '</article>' + warn +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px">' +
        '<button type="button" data-act="prev" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:12px 18px;font-size:14px;cursor:pointer;transition:border-color .15s ease,color .15s ease;color:'+(S.i===0?'#c4bfb4':'#121a2b')+';pointer-events:'+(S.i===0?'none':'auto')+'">← Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (early ? '<button type="button" data-act="finish" class="h-ink" style="background:none;border:0;padding:12px 6px;'+mono+';font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#8a8578;cursor:pointer;text-decoration:underline;text-underline-offset:3px">Finalizar</button>' : '') +
          '<button type="button" data-act="next" class="h-darkflat" style="background:#121a2b;color:#f5f3ef;border:0;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;transition:background .16s ease">'+(last?'Finalizar':'Próxima →')+'</button>' +

function reviewList(){
  return S.order.map(function(q,n){
    var a = S.answers[n], ok = a!==null && a===q.correctIndex;
    return { idx:n, ok:ok, blank:a===null, q:q, a:a };
  }).filter(function(r){
    return S.filter==='all' || (S.filter==='wrong'&&!r.ok&&!r.blank) || (S.filter==='right'&&r.ok) || (S.filter==='blank'&&r.blank);
  });
}

        stat(c.hit,'Certas','#2e7d55')+stat(c.miss,'Erradas','#c04437')+stat(c.blank,'Branco','#8a8578')+stat(pct+'%','Aproveit.','#2b57cc') +

        '<button type="button" data-act="toggleAll" class="h-ink" style="background:none;border:0;padding:6px 0;'+mono+';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6478;cursor:pointer;text-decoration:underline;text-underline-offset:3px">'+(allOpen?'Recolher tudo':'Expandir tudo')+'</button>' +
      '</div>' +

      (list.length===0 ? '<div style="padding:38px 16px;text-align:center;color:#8a8578;font-size:14px;border:1px dashed #ddd8ce;border-radius:14px">Nenhuma questão neste filtro.</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:28px;padding-top:24px;border-top:1px solid #e4e0d8">' +

        '<button type="button" data-act="resumo" class="h-line" style="background:none;border:1px solid #ddd8ce;border-radius:11px;padding:13px 22px;font-size:14px;cursor:pointer;transition:border-color .15s ease">Ler o resumo</button>' +

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
