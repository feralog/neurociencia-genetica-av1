<script type="text/html" id="resumoSrc"><h2>1. Da máscara ao construto científico</h2>
<p>A palavra que nomeia todo o campo nasce no palco. <strong>Persona</strong>, no latim (e <em>prosopon</em>, no grego), designava a máscara de teatro que os atores do mundo clássico vestiam. A máscara tinha duas funções ao mesmo tempo: <strong>ocultava a face real</strong> do ator e, pelo formato de sua boca, <strong>amplificava a voz</strong> para que o anfiteatro inteiro ouvisse. Guarde essa dupla função — ocultar e projetar — porque ela retorna intacta, séculos depois, no arquétipo junguiano da Persona.</p>
<p>Ao longo dos séculos o sentido migra: o termo deixa de nomear <em>a máscara que se usa</em> e passa a nomear <em>o sujeito que a veste</em>. Nasce a "pessoa" como portadora de direitos, deveres e de uma interioridade psicológica própria.</p>
<p>A virada científica tem data e autor. Em <strong>1937, Gordon Allport</strong> publica a obra que funda o campo moderno da personalidade na psicologia, definindo-a como:</p>
<blockquote><p>"Organização dinâmica, dentro do indivíduo, dos sistemas psicofísicos que determinam seu comportamento e pensamento característicos."</p></blockquote>
<p>Duas palavras dessa definição fazem todo o trabalho. <em>Organização</em> indica que há estrutura, e não amontoado. <em>Dinâmica</em> indica que essa estrutura se move. A personalidade deixa então de ser alma abstrata ou traço moral — o velho "caráter forte" — e passa a ser um <strong>construto científico</strong>: uma estrutura <em>inferida</em> a partir do comportamento observável, dotada de <strong>estabilidade temporal</strong> e <strong>consistência situacional</strong>, mas <strong>aberta à transformação</strong>.</p>
<blockquote><p>Construto não é coisa. Ninguém vê a personalidade; vê-se comportamento, e a partir dele se infere a organização que o produz. Por isso toda teoria da personalidade é uma lente, nunca uma fotografia.</p></blockquote>
<hr>
<h2>2. O paradigma biopsicossocial: temperamento e caráter</h2>
<p>Para explicar por que as personalidades são tão diversas, o modelo contemporâneo recusa os dois extremos — o <strong>reducionismo biológico</strong> ("é tudo genética") e o <strong>determinismo cultural</strong> ("é tudo ambiente") — e adota o <strong>paradigma biopsicossocial</strong>, organizado em dois eixos.</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Temperamento</strong></th><th><strong>Caráter</strong></th></tr></thead><tbody><tr><td>Natureza</td><td>Dimensão constitucional, biológica</td><td>Dimensão adquirida, cultural e social</td></tr><tr><td>Conteúdo</td><td>Tendências herdadas; aspectos <em>formais</em> do comportamento: nível de atividade, reatividade emocional, ritmo biológico, limiar de estimulação</td><td>Valores, crenças, hábitos e autoconceito internalizados</td></tr><tr><td>Origem</td><td>Forte determinação genética; sistema límbico e neurotransmissores</td><td>Socialização, cultura, ambiente familiar</td></tr><tr><td>Quando aparece</td><td>Desde os primeiros meses (bebês calmos × bebês reativos)</td><td>Ao longo de toda a vida, por aprendizado e reflexão</td></tr><tr><td>Função</td><td>É a <strong>matéria-prima biológica</strong></td><td><strong>Modula</strong> o temperamento; introduz moral, ética e adaptação</td></tr></tbody></table></div>
<h4>A interação indissociável</h4>
<p>Os dois eixos não são camadas empilhadas: eles se determinam mutuamente pela <strong>epigenética</strong> — o ambiente e a cultura modificam a expressão dos genes. É por isso que a mesma base temperamental pode produzir desfechos opostos:</p>
<ul><li>Temperamento muito reativo ao medo <strong>+ ambiente hostil</strong> → caráter ansioso e isolado.</li><li>O mesmo temperamento <strong>+ ambiente acolhedor e estimulante</strong> → caráter prudente e analítico.</li></ul>
<blockquote><p>Não existe traço biológico com destino fixo. O gene propõe; a história de vida dispõe. Confundir temperamento com caráter é o erro clássico — o primeiro é <em>forma</em>, o segundo é <em>conteúdo valorativo</em>.</p></blockquote>
<hr>
<h2>3. Nomotético × idiográfico: como investigar a diversidade</h2>
<p>A diversidade impõe um problema de método: para conhecer o humano, olha-se o que ele tem em comum com os outros, ou o que ele tem de único? Duas matrizes científicas se confrontam.</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Nomotético</strong></th><th><strong>Idiográfico</strong></th></tr></thead><tbody><tr><td>Foca em</td><td>Semelhanças entre as pessoas</td><td>Diferenças e unicidade do indivíduo</td></tr><tr><td>Busca</td><td>Traços e estruturas universais</td><td>Um sistema único e irrepetível</td></tr><tr><td>Ferramentas</td><td>Métodos quantitativos, psicometria, análise fatorial (ex.: <strong>Big Five</strong>)</td><td>Métodos qualitativos, estudo de caso, análise de narrativas, fenomenologia</td></tr><tr><td>Vantagem</td><td>Comparação entre indivíduos, diagnóstico padronizado, previsão estatística</td><td>Captura a riqueza da subjetividade e a complexidade da diversidade</td></tr><tr><td>Limite</td><td>Risco de desumanizar, reduzindo o sujeito a uma pontuação num gráfico</td><td>Extrema dificuldade em gerar generalizações e predições populacionais</td></tr></tbody></table></div>
<h4>A síntese na prática</h4>
<p>O psicólogo contemporâneo — clínico, organizacional ou social — não escolhe um lado. Ele usa o conhecimento <strong>nomotético como mapa geral</strong> da mente humana e aplica uma <strong>escuta idiográfica</strong> para acolher a forma única como <em>aquele</em> paciente habita o mapa.</p>
<blockquote><p>Frase-síntese para prova: o nomotético dá o mapa, o idiográfico dá o território vivido. Teste padronizado sem escuta singular vira rótulo; escuta singular sem referência populacional vira impressionismo.</p></blockquote>
<hr>
<h2>4. O que valida uma teoria da personalidade</h2>
<p>Uma teoria não é verdade absoluta — é lente. Para ser científica e útil à clínica, precisa cumprir <strong>três critérios</strong>:</p>
<ol><li><strong>Utilidade prática</strong> — fornecer ferramentas concretas para organizar informações, compreender o sofrimento e planejar intervenções eficazes. Se não guia a clínica, é especulação abstrata.</li><li><strong>Falseabilidade (Karl Popper)</strong> — formular hipóteses testáveis e passíveis de serem provadas falsas. Uma teoria que explica <em>absolutamente tudo</em> e nunca pode ser questionada por dados empíricos perde o caráter de ciência rigorosa.</li><li><strong>Capacidade heurística</strong> — estimular novas pesquisas e gerar novas perguntas. Boa teoria não encerra o debate; expande.</li></ol>
<blockquote><p>A falseabilidade é o critério mais cobrado, e o mais contraintuitivo: o poder explicativo total é um <em>defeito</em>, não uma virtude. Popper é o nome a fixar.</p></blockquote>
<hr>
<h2>5. Ética da diversidade: viés W.E.I.R.D., decolonialidade e neurodiversidade</h2>
<h3>O viés eurocêntrico e a amostra W.E.I.R.D.</h3>
<p>A maior parte das teorias clássicas da personalidade — da psicodinâmica aos modelos de traços — foi produzida no século XX por teóricos europeus e norte-americanos. Estudos contemporâneos apontam o problema amostral com um acrônimo:</p>
<h4>W.E.I.R.D.</h4>
<p><strong>W</strong>estern · <strong>E</strong>ducated · <strong>I</strong>ndustrialized · <strong>R</strong>ich · <strong>D</strong>emocratic — ocidentais, instruídas, industrializadas, ricas e democráticas.</p>
<p><strong>Menos de 12% da população mundial</strong> se encaixa nessa descrição. Ainda assim, a psicologia tentou aplicar conclusões extraídas desse recorte como se fossem <strong>leis universais</strong> para toda a humanidade.</p>
<h4>O olhar decolonial</h4>
<p>O psicólogo no Brasil não atende o sujeito idealizado das teorias europeias. Atende sujeitos atravessados por vulnerabilidade social, racismo estrutural, desigualdade e violência de gênero. A <strong>escuta decolonial</strong> implica reconhecer que traços classificados por testes padronizados internacionais como "passividade", "agressividade" ou "desadaptação" podem ser, na verdade, <strong>estratégias subjetivas de sobrevivência</strong> ou modos de vida legítimos de povos indígenas, quilombolas ou periféricos.</p>
<blockquote><p>A decolonialidade exige que a cultura local não seja vista como desvio, mas como <strong>o solo de onde a personalidade brota</strong>. O rigor científico só se sustenta aliado à ética do respeito à dignidade humana; a pesquisa deve expandir o entendimento do humano, nunca produzir camisas de força que patologizem diferenças culturais e minorias.</p></blockquote>
<h3>Neurodiversidade e o limite da psicopatologia</h3>
<p><strong>Neurodiversidade</strong>: variações no funcionamento neurológico e na personalidade — como o Transtorno do Espectro Autista (TEA) e o TDAH — são <strong>variações naturais e saudáveis do genoma humano</strong>, e não doenças a serem extirpadas. O foco da intervenção se desloca de <em>"consertar o defeito"</em> para <em>"promover acessibilidade e respeito"</em> a outra forma de vivenciar o mundo.</p>
<p>Onde, então, começa a psicopatologia? O critério contemporâneo repousa em <strong>dois eixos</strong>, e nenhum deles é o desvio estatístico:</p>
<ol><li><strong>Sofrimento subjetivo</strong> — esse modo de funcionar causa à própria pessoa um sofrimento íntimo, profundo e paralisante?</li><li><strong>Prejuízo funcional rígido</strong> — impede o sujeito de realizar seus planos, trabalhar, amar ou manter laços sociais mínimos, aprisionando-o na rigidez?</li></ol>
<div class="tbl"><table><thead><tr><th>Situação</th><th>Leitura clínica</th></tr></thead><tbody><tr><td>Difere da média, mas é <strong>flexível</strong>, está bem e mantém laços</td><td><strong>Diversidade</strong></td></tr><tr><td><strong>Rigidez extrema</strong> com sofrimento destrutivo e prejuízo funcional</td><td><strong>Psicopatologia</strong></td></tr></tbody></table></div>
<blockquote><p>Ser diferente da média não é adoecer. Os marcadores são <strong>sofrimento</strong> e <strong>rigidez</strong> — não raridade, não estranheza, não reprovação social do grupo.</p></blockquote>
<hr>
<h2>6. Freud: as duas tópicas e a economia do ego</h2>
<p>Para a psicanálise, a personalidade não é superfície plana: é o resultado dinâmico de forças em conflito permanente. Freud a mapeia em dois momentos <strong>complementares</strong> (a segunda tópica não revoga a primeira).</p>
<h4>Primeira tópica — modelo topográfico (1900)</h4>
<ul><li><strong>Consciente</strong> — camada superficial: pensamentos, percepções e sentimentos acessíveis agora.</li><li><strong>Pré-consciente</strong> — território de transição: memórias e conhecimentos evocáveis com um esforço de atenção.</li><li><strong>Inconsciente</strong> — a maior e mais profunda parte: reservatório vivo de desejos censurados, traumas, impulsos e instintos recalcados. Tem lógica própria (<strong>processo primário</strong>) e governa a maior parte do comportamento sem que percebamos.</li></ul>
<h4>Segunda tópica — modelo estrutural (1923)</h4>
<div class="tbl"><table><thead><tr><th>Instância</th><th>Consciência</th><th>Princípio</th><th>Função</th></tr></thead><tbody><tr><td><strong>Id</strong></td><td>Totalmente inconsciente</td><td><strong>Prazer</strong></td><td>Matriz original da personalidade; exige satisfação imediata dos impulsos biológicos e sexuais (libido). Não conhece moralidade nem lógica</td></tr><tr><td><strong>Ego</strong></td><td>Em grande parte consciente e pré-consciente</td><td><strong>Realidade</strong></td><td>Mediador; satisfaz os desejos do id de forma segura e socialmente aceitável</td></tr><tr><td><strong>Superego</strong></td><td>Parcialmente inconsciente</td><td>Moral</td><td>Juiz interno, formado pela internalização das normas parentais e culturais no Complexo de Édipo; contém o <strong>ideal do ego</strong> e a <strong>consciência moral</strong>; pune o ego com <strong>culpa</strong></td></tr></tbody></table></div>
<h4>Mecanismos de defesa</h4>
<p>O ego vive pressionado por três lados: os impulsos cegos do id, as exigências morais do superego e os limites da realidade externa. Quando falha em mediar, surge a <strong>angústia</strong>. Para evitar o colapso, o ego aciona <strong>inconscientemente</strong> defesas que distorcem a realidade:</p>
<div class="tbl"><table><thead><tr><th>Mecanismo</th><th>Operação</th><th>Exemplo</th></tr></thead><tbody><tr><td><strong>Recalque</strong></td><td>Afasta da consciência o desejo insuportável, empurrando-o ao inconsciente</td><td>O motivo do sintoma "some" da lembrança</td></tr><tr><td><strong>Projeção</strong></td><td>Atribui ao outro o afeto inaceitável do próprio sujeito</td><td>"Ele me odeia", em vez de "eu o odeio"</td></tr><tr><td><strong>Sublimação</strong></td><td>Desvia a energia pulsional para fins socialmente valorizados</td><td>Agressividade vira arte ou esporte</td></tr><tr><td><strong>Formação reativa</strong></td><td>Adota o comportamento <strong>oposto</strong> ao desejo reprimido</td><td>Carinho excessivo por quem secretamente se detesta</td></tr></tbody></table></div>
<blockquote><p>Não confunda: <strong>sublimação</strong> transforma o destino da pulsão em algo valorizado; <strong>formação reativa</strong> inverte o sinal do afeto. Sublimar é canalizar; reagir formativamente é fingir o contrário — inclusive para si mesmo.</p></blockquote>
<h4>Determinismo psíquico e as fases da libido</h4>
<p>O <strong>determinismo psíquico</strong> afirma que nada na mente acontece por acaso: cada escolha, sintoma, esquecimento ou traço atual é determinado por eventos e conflitos da infância. A personalidade se desenvolve conforme a libido se concentra em diferentes zonas erógenas:</p>
<div class="tbl"><table><thead><tr><th>Fase</th><th>Idade</th><th>Foco</th><th>Traços que molda</th></tr></thead><tbody><tr><td><strong>Oral</strong></td><td>0–1 ano</td><td>Boca, amamentação</td><td>Dependência, otimismo, sarcasmo (conforme o desmame)</td></tr><tr><td><strong>Anal</strong></td><td>1–3 anos</td><td>Controle dos esfíncteres</td><td>Organização, teimosia, avareza ou generosidade</td></tr><tr><td><strong>Fálica</strong></td><td>3–6 anos</td><td>Órgãos genitais; <strong>Complexo de Édipo</strong></td><td>Resolução bem-sucedida dota o sujeito de <strong>superego funcional</strong> e identidade de gênero</td></tr><tr><td><strong>Latência</strong></td><td>6–7 anos em diante</td><td>Aquietamento pulsional</td><td>Socialização e aprendizado intelectual</td></tr><tr><td><strong>Genital</strong></td><td>Puberdade em diante</td><td>Parceiros externos</td><td>Personalidade madura e maturidade psicossocial</td></tr></tbody></table></div>
<p>Para a psicanálise, a "personalidade normal" é, na verdade, <strong>um arranjo defensivo estável</strong>. O clínico usa esse mapa não para rotular, mas para localizar a raiz infantil dos conflitos atuais e ajudar o paciente a flexibilizar suas defesas.</p>
<hr>
<h2>7. Jung: inconsciente coletivo, arquétipos e individuação</h2>
<p>A psicologia analítica de Carl Gustav Jung desloca a questão. A psique não apenas <em>media conflitos</em>: ela <strong>caminha ativamente</strong> rumo ao desenvolvimento de todo o potencial humano, ligando a história do sujeito à história da espécie.</p>
<h4>Três níveis de profundidade</h4>
<ul><li><strong>Ego (consciência)</strong> — centro da mente consciente; responde pelo senso de identidade, continuidade, memória e percepção da realidade imediata.</li><li><strong>Inconsciente pessoal</strong> — camada contígua ao ego: o esquecido, o reprimido, o percebido de forma subliminar. É onde se formam os <strong>complexos</strong> (grupos de ideias e memórias carregados de forte valor emocional).</li><li><strong>Inconsciente coletivo</strong> — a maior inovação de Jung. Camada mais profunda, que <strong>não depende da experiência pessoal</strong>: herança filogenética, estrutura universal compartilhada por todos os humanos, independente de época e cultura. Seu conteúdo são os <strong>arquétipos</strong> — moldes e imagens primordiais que determinam como reagimos e damos sentido às grandes experiências (nascimento, morte, perigo, amor).</li></ul>
<h4>Os quatro arquétipos centrais</h4>
<div class="tbl"><table><thead><tr><th>Arquétipo</th><th>O que é</th><th>Risco / dinâmica</th></tr></thead><tbody><tr><td><strong>Persona</strong></td><td>A face apresentada ao mundo para se adaptar socialmente, exercer a profissão e cumprir papéis</td><td>Identificar-se <em>totalmente</em> com ela e esquecer a identidade por trás do papel</td></tr><tr><td><strong>Sombra</strong></td><td>O oposto da persona: traços, desejos e impulsos vistos como inferiores ou incompatíveis com a autoimagem idealizada</td><td>É <strong>projetada nos outros</strong>, gerando preconceito e intolerância, até ser integrada</td></tr><tr><td><strong>Anima / Animus</strong></td><td>A psique é intrinsecamente bissexual. <strong>Anima</strong>: contraparte feminina inconsciente no homem (intuição, afeto, conexão). <strong>Animus</strong>: contraparte masculina inconsciente na mulher (lógica, ação, afirmação)</td><td>Integrar as polaridades equilibra sensibilidade e razão</td></tr><tr><td><strong>Self (Si-Mesmo)</strong></td><td>Arquétipo da ordem, da totalidade e da unificação; <strong>verdadeiro centro da personalidade</strong></td><td>Equilibra mente consciente e inconsciente</td></tr></tbody></table></div>
<blockquote><p>Cuidado com a pegadinha: o <strong>ego</strong> é o centro da <em>consciência</em>; o <strong>Self</strong> é o centro da <em>personalidade total</em>. Não são sinônimos.</p></blockquote>
<h4>Individuação</h4>
<p>É o conceito central da clínica junguiana: jornada contínua de amadurecimento pela qual o sujeito se torna aquilo que verdadeiramente foi destinado a ser. Exige um diálogo corajoso entre ego e inconsciente:</p>
<ol><li>Reconhecer os papéis sociais da Persona <strong>sem ser engolido</strong> por eles.</li><li>Encarar a própria <strong>Sombra</strong>, retirando as projeções feitas nos outros e aceitando os próprios defeitos.</li><li>Integrar <strong>Anima/Animus</strong>, equilibrando sensibilidade e razão.</li></ol>
<p>A individuação <strong>não busca perfeição nem normalidade estatística — busca completude</strong>. O sentido da vida, para Jung, está em fazer as pazes com as forças opostas que habitam o interior. Na clínica, sintomas como a depressão ou a ansiedade na metade da vida não são apenas disfunções: sinalizam que o processo de individuação <strong>empacou</strong>.</p>
<hr>
<h2>8. Relações objetais: Klein, Winnicott e o mundo interno</h2>
<p>A Escola das Relações Objetais opera a grande revolução pós-freudiana. Aqui a personalidade <strong>não se estrutura apenas no conflito entre impulsos internos</strong> (id × ego), mas no modo como o bebê <strong>internaliza suas primeiras relações afetivas</strong> com os cuidadores primários — os "objetos".</p>
<h4>Melanie Klein — o mundo interno primitivo</h4>
<p>O bebê nasce com um ego primitivo, porém ativo, que precisa lidar de imediato com a <strong>angústia de aniquilamento</strong>. A personalidade se estrutura no trânsito contínuo entre duas <strong>posições</strong> (modos de organizar a experiência e os vínculos):</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Posição esquizoparanoide</strong></th><th><strong>Posição depressiva</strong></th></tr></thead><tbody><tr><td>Quando</td><td>Primeiros meses de vida</td><td>Meados do primeiro ano</td></tr><tr><td>Operação central</td><td><strong>Cisão (esquizo)</strong>: o seio materno é dividido em <strong>seio bom</strong> (alimenta, acolhe, é amado) e <strong>seio mau</strong> (frustra, demora, é odiado)</td><td><strong>Integração</strong>: o bebê percebe que seio bom e seio mau pertencem à <strong>mesma</strong> pessoa, a mãe</td></tr><tr><td>Angústia</td><td><strong>Persecutória</strong>: projeta a agressividade inata no seio mau e teme ser atacado e destruído por ele</td><td><strong>Depressiva</strong>: teme ter <strong>destruído a mãe boa</strong> com seus ataques de fúria</td></tr><tr><td>Afeto dominante</td><td>Medo; mundo do "tudo ou nada"</td><td><strong>Culpa</strong> e <strong>ambivalência</strong> (amar e odiar a mesma pessoa)</td></tr><tr><td>Saída madura</td><td>—</td><td><strong>Reparação</strong>: desejo de reparar o dano imaginado, gerando <strong>empatia, sublimação</strong> e relacionamentos realistas</td></tr></tbody></table></div>
<blockquote><p>Posição não é etapa vencida e abandonada — é modo de funcionamento ao qual se retorna. Sob estresse intenso, o adulto pode recair na cisão do mundo em "todo bom" e "todo mau".</p></blockquote>
<h4>Donald Winnicott — o ambiente facilitador</h4>
<p>Enquanto Klein foca nas <strong>fantasias inconscientes internas</strong> do bebê, Winnicott — pediatra de formação — desloca o olhar para a <strong>relação real</strong> da dupla mãe-bebê. Daí sua frase célebre:</p>
<blockquote><p>"Não existe essa coisa chamada bebê… o que existe é um bebê e alguém."</p></blockquote>
<ul><li><strong>Preocupação materna primária</strong> — estado mental de sensibilidade extrema nos últimos meses de gestação e primeiras semanas pós-parto, que permite à mãe identificar e satisfazer as necessidades sutis do recém-nascido.</li><li><strong>Mãe suficientemente boa</strong> — <strong>não</strong> é a mãe perfeita (a perfeição gera rigidez). É a que se adapta totalmente no início, dando ao bebê a <strong>ilusão de onipotência</strong> (criar o mundo), e depois introduz <strong>frustrações graduais e toleráveis</strong>. Essa falha gradual e amorosa é o que empurra a criança a reconhecer a realidade externa.</li><li><strong>Ambiente facilitador</strong> — oferece <strong>holding</strong> (sustentação física e emocional), <strong>handling</strong> (manejo corporal correto) e a <strong>apresentação adequada dos objetos</strong>. Se falha gravemente, o desenvolvimento é interrompido por invasões da realidade que o bebê não consegue processar.</li></ul>
<h4>Verdadeiro-self × falso-self</h4>
<p>A qualidade do ambiente determina o padrão estrutural da personalidade.</p>
<div class="tbl"><table><thead><tr><th></th><th><strong>Verdadeiro-self</strong></th><th><strong>Falso-self</strong></th></tr></thead><tbody><tr><td>Ambiente de origem</td><td>Seguro; valida os gestos espontâneos e as necessidades reais</td><td>Falha repetidamente; exige que o bebê se adapte às necessidades e humores da mãe</td></tr><tr><td>Aprendizado do bebê</td><td>Pode existir a partir de si</td><td>Aprende a "adivinhar" o que a mãe quer, para não ser abandonado</td></tr><tr><td>Resultado adulto</td><td>Criatividade, sentimento de estar genuinamente vivo, autenticidade nas relações</td><td>Máscara de submissão, polidez e adequação social perfeita — o "bebê bonzinho" que nunca chora</td></tr><tr><td>Vivência íntima</td><td>Espontaneidade</td><td><strong>Vazio crônico, falsidade e tédio existencial</strong></td></tr></tbody></table></div>
<p>Na clínica, o psicólogo atua como <strong>novo ambiente facilitador</strong>: pelo holding da escuta terapêutica, permite que o paciente deponha as defesas rígidas do falso-self e se reconecte com a espontaneidade do verdadeiro-self.</p>
<hr>
<h2>9. Comparativo final das matrizes</h2>
<div class="tbl"><table><thead><tr><th>Matriz</th><th>Autor</th><th>O que estrutura a personalidade</th><th>Conceitos-chave</th></tr></thead><tbody><tr><td><strong>Traços / nomotética</strong></td><td>Gordon Allport</td><td>Organização dinâmica de sistemas psicofísicos, inferida do comportamento</td><td>Construto científico, estabilidade e consistência, Big Five</td></tr><tr><td><strong>Psicanálise clássica</strong></td><td>Sigmund Freud</td><td>Conflito entre instâncias e destino da libido na infância</td><td>Tópicas, id-ego-superego, defesas, determinismo psíquico, fases</td></tr><tr><td><strong>Psicologia analítica</strong></td><td>Carl Gustav Jung</td><td>Diálogo entre ego e inconsciente, rumo à totalidade</td><td>Inconsciente coletivo, arquétipos, individuação, Self</td></tr><tr><td><strong>Relações objetais</strong></td><td>Melanie Klein</td><td>Fantasias inconscientes e internalização do objeto</td><td>Posições esquizoparanoide e depressiva, cisão, reparação</td></tr><tr><td><strong>Relações objetais</strong></td><td>Donald Winnicott</td><td>Qualidade real do ambiente de cuidado</td><td>Holding, mãe suficientemente boa, verdadeiro e falso-self</td></tr></tbody></table></div>
<blockquote><p>Três distinções que mais confundem em prova: <strong>temperamento × caráter</strong> (herdado × adquirido); <strong>inconsciente pessoal × coletivo</strong> (biográfico × filogenético); <strong>Klein × Winnicott</strong> (fantasia interna × relação real com o ambiente).</p></blockquote></script>

var LETTERS = ['A','B','C','D','E','F'];
var SHUFFLE = true, LOCK = true;

var S = { view:'home', started:false, finished:false, i:0, order:[], answers:[], open:{}, filter:'all', warn:false, chat:{} };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }

function build(){
  var qs = QUIZ.map(function(q,id){ return { question:q.question, options:q.options.slice(), correctIndex:q.correctIndex, explanation:q.explanation, image:q.image, imageCaption:q.imageCaption, id:id }; });
  if (!SHUFFLE) return qs;
  for (var i=qs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=qs[i]; qs[i]=qs[j]; qs[j]=t; }
  return qs.map(function(q){
    var correct = q.options[q.correctIndex], o = q.options.slice();
    for (var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    q.options = o; q.correctIndex = o.indexOf(correct); return q;
  });
}

/* ── ações ─────────────────────────────────────────────────────────────────── */
var A = {
  home:      function(){ S.view='home'; S.started=false; S.finished=false; up(0); },
  resumo:    function(){ S.view='resumo'; up(0); },
  start:     function(){ var o=build(); S.view='quiz'; S.started=true; S.finished=false; S.i=0; S.order=o;
                         S.answers=new Array(o.length).fill(null); S.open={}; S.filter='all'; S.warn=false; up(0); },
  restart:   function(){ A.start(); },
  sair:      function(){ S.view='home'; S.started=false; up(0); },   // guarda as respostas
  retomar:   function(){ S.view='quiz'; S.started=true; S.finished=false; S.warn=false; up(0); },
  go:        function(n){ if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; render(); },
  jump:      function(n){ if(S.finished){ S.finished=false; S.i=n; S.warn=false; } else { if(n<0||n>S.order.length-1) return; S.i=n; S.warn=false; } up(0,'smooth'); },
  pick:      function(n){ if(LOCK && S.answers[S.i]!==null) return; S.answers[S.i]=n; render(); },
  prev:      function(){ A.go(S.i-1); },
  next:      function(){ if(S.i<S.order.length-1) A.go(S.i+1); else A.finish(); },
  finish:    function(){ var b=S.answers.filter(function(a){return a===null}).length;
                         if(b>0 && !S.warn){ S.warn=true; render(); return; } S.finished=true; S.warn=false; up(0); },
  force:     function(){ S.finished=true; S.warn=false; up(0); },
  gotoBlank: function(){ var n=S.answers.findIndex(function(a){return a===null}); if(n>=0) A.go(n); },
  back:      function(){ S.finished=false; S.warn=false; up(0); },
  filter:    function(k){ S.filter=k; render(); },
  toggle:    function(n){ S.open[n]=!S.open[n]; render(); },
  toggleAll: function(){ var r=reviewList(), all=r.length>0 && r.every(function(x){return S.open[x.idx]});
                         S.open={}; if(!all) r.forEach(function(x){ S.open[x.idx]=true; }); render(); }
};
function up(top, beh){ render(); window.scrollTo({ top: top||0, behavior: beh||'auto' }); }

/* Aberto por duplo clique (file://) volta para o indice local; servido pela web,
   volta para o publicado. Os dois listam os mesmos materiais. */
function idxHref(){
  var local = (typeof location !== 'undefined' && location.protocol === 'file:');
  return local ? '../index_local.html' : '../index.html';
}
function emAndamento(){
  return S.order.length > 0 && !S.finished &&
         S.answers.some(function(a){ return a !== null; });
}

  if (S.view === 'quiz' && S.started) {

      if (a!==null) bg = (a===q.correctIndex) ? '#2e7d55' : '#c04437';

      var st = a===null ? 'em branco' : (a===q.correctIndex ? 'correta' : 'incorreta');
      return '<button type="button" data-act="jump" data-n="'+n+'" title="Questão '+(n+1)+' — '+st+'" aria-label="Questão '+(n+1)+' — '+st+'" style="flex:1 1 0;min-width:0;background:none;border:0;padding:13px 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center">' +

                dot('#2e7d55',c.hit)+dot('#c04437',c.miss)+dot('#d3cec4',c.blank) +
              '</div></div></div>';
  }
  document.getElementById('hdr').innerHTML = html;

function dot(color,n){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:99px;background:'+color+';display:block"></span>'+n+'</span>'; }

function counts(){
  var hit=0, miss=0, blank=0;
  S.answers.forEach(function(a,n){
    if (a===null) blank++;
    else if (S.order[n] && a===S.order[n].correctIndex) hit++;
    else miss++;
  });
  return { hit:hit, miss:miss, blank:blank, total:S.order.length };
}

/* ── questão ───────────────────────────────────────────────────────────────── */
function renderQuestion(){
  var mono = "font-family:'IBM Plex Mono',monospace";
  var q = S.order[S.i], ans = S.answers[S.i], reveal = ans !== null;

  var status = 'Não respondida', sColor = '#8a8578';
  if (reveal) { var ok = ans===q.correctIndex; status = ok?'Você acertou':'Você errou'; sColor = ok?'#2e7d55':'#c04437'; }

  var opts = q.options.map(function(text,n){
    var isC = n===q.correctIndex, isMine = n===ans;
    var bd='#e4e0d8', bg='#fff', fg='#121a2b', bBg='#f2efe9', bFg='#8a8578', mark='', mColor='', op='1', hbd='#2b57cc';
    if (reveal) {
      op = (isC||isMine) ? '1' : '.62';
      if (isC)               { bd='#8fc7a7'; bg='#eef7f1'; fg='#1f5c3e'; bBg='#2e7d55'; bFg='#fff'; mark='✓'; mColor='#2e7d55'; }

/* ── render + eventos ──────────────────────────────────────────────────────── */

/* ─── Tutor DeepSeek — só local, só quando a questão foi errada ──────────────
   A chave vem de ../deepseek_key.js, que não existe na versão publicada: online
   o arquivo dá 404, dsOn() vira false e o chat simplesmente não é renderizado.
   O histórico fica em S.chat[idDaQuestao] e sobrevive ao re-render do stage. */
var DS_MODEL = 'deepseek-v4-flash';
var DS_URL   = 'https://api.deepseek.com/chat/completions';
var NLJS     = String.fromCharCode(10);
var DS_MONO  = "font-family:'IBM Plex Mono',monospace";
var DS_SANS  = "font-family:'IBM Plex Sans',system-ui,sans-serif";

function dsOn(){ return typeof window.DEEPSEEK_KEY === 'string' && window.DEEPSEEK_KEY.length > 10; }


/* ─── markdown do chat ───────────────────────────────────────────────────────
   O modelo responde em markdown (**negrito**, listas, `codigo`, tabelas). O texto
   vem de fora, entao a ordem importa: ESCAPA TUDO primeiro com esc() e so depois
   aplica formatacao — assim nenhuma tag vinda da resposta vira HTML de verdade.
   Como esc() ja trocou > por &gt;, a citacao casa com &gt; e nao com >.
   Trechos de codigo saem de cena por um marcador NUL, que nao pode existir
   no texto escapado, e voltam no fim — assim ` ` protege o que esta dentro. */
function mdIn(t){
  var Z = String.fromCharCode(0), codes = [];
  t = t.replace(/`([^`]+)`/g, function(_, c){
    codes.push(c);
    return Z + 'c' + (codes.length - 1) + Z;
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener" style="color:#2b57cc">$1</a>');
  return t.replace(new RegExp(Z + 'c([0-9]+)' + Z, 'g'), function(_, i){
    return '<code style="' + DS_MONO + ';font-size:12px;background:#f2efe9;' +
           'border-radius:4px;padding:1px 5px">' + codes[i] + '</code>';
  });
}

function mdChat(txt){
  var Z = String.fromCharCode(0);
  var t = esc(String(txt == null ? '' : txt));
  var blocos = [];
  t = t.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, function(_, c){
    blocos.push(c.replace(/\n+$/, ''));
    return Z + 'b' + (blocos.length - 1) + Z;
  });

  var linhas = t.split('\n'), out = [], lista = null, par = [];
  function fechaLista(){ if (lista) { out.push('</' + lista + '>'); lista = null; } }
  function fechaPar(){
    if (par.length) { out.push('<p style="margin:0 0 9px">' + mdIn(par.join(' ')) + '</p>'); par = []; }
  }
  function fecha(){ fechaPar(); fechaLista(); }

  for (var i = 0; i < linhas.length; i++){
    var l = linhas[i], t2 = l.trim();
    if (!t2) { fecha(); continue; }

    var bl = t2.match(new RegExp('^' + Z + 'b([0-9]+)' + Z + '$'));
    if (bl) {
      fecha();
      out.push('<pre style="margin:0 0 9px;padding:9px 11px;background:#f7f6f2;border-radius:9px;' +
               'overflow-x:auto;' + DS_MONO + ';font-size:12px;line-height:1.5">' + blocos[bl[1]] + '</pre>');
      continue;
    }

    // tabela: linha com | ... | seguida da separadora | --- | --- |
    if (t2.charAt(0) === '|' && i + 1 < linhas.length && /^\|[\s:|-]+\|$/.test(linhas[i+1].trim())) {
      fecha();
      var celulas = function(linha){
        return linha.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdIn(c.trim()); });
      };
      var cab = celulas(t2), corpo = [];
      i += 2;
      while (i < linhas.length && linhas[i].trim().charAt(0) === '|') { corpo.push(celulas(linhas[i].trim())); i++; }
      i--;
      var cel = 'padding:5px 9px;border-bottom:1px solid #eae6de;text-align:left;vertical-align:top';
      out.push('<div style="overflow-x:auto;margin:0 0 9px">' +
        '<table style="border-collapse:collapse;font-size:12.5px;width:100%">' +
        '<thead><tr>' + cab.map(function(c){ return '<th style="' + cel + ';font-weight:600">' + c + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody>' + corpo.map(function(r){
          return '<tr>' + r.map(function(c){ return '<td style="' + cel + '">' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>');
      continue;
    }

    var h = t2.match(/^#{1,6}\s+(.*)$/);
    if (h) {
      fecha();
      out.push('<div style="font-weight:600;color:#121a2b;margin:11px 0 5px">' + mdIn(h[1]) + '</div>');
      continue;
    }

    if (/^(---+|\*\*\*+)$/.test(t2)) {
      fecha();
      out.push('<hr style="border:0;border-top:1px solid #eae6de;margin:11px 0">');
      continue;
    }

    var cit = t2.match(/^&gt;\s?(.*)$/);
    if (cit) {
      fecha();
      out.push('<div style="margin:0 0 9px;padding:7px 11px;border-left:2.5px solid #c9d6f7;' +
               'background:#f7f9fe;border-radius:0 7px 7px 0">' + mdIn(cit[1]) + '</div>');
      continue;
    }

    var mUl = t2.match(/^[-*•]\s+(.*)$/);
    var mOl = t2.match(/^\d+[.)]\s+(.*)$/);
    if (mUl || mOl) {
      var tipo = mUl ? 'ul' : 'ol';
      fechaPar();
      if (lista !== tipo) {
        fechaLista();
        out.push('<' + tipo + ' style="margin:0 0 9px;padding-left:19px">');
        lista = tipo;
      }
      out.push('<li style="margin:3px 0">' + mdIn((mUl || mOl)[1]) + '</li>');
      continue;
    }

    fechaLista();
    par.push(t2);
  }
  fecha();
  return out.join('');
}

function msgHTML(m){
  if (m.role === 'user')
    return '<div style="margin:0 0 10px;text-align:right">' +
      '<span style="display:inline-block;max-width:88%;text-align:left;background:#f2efe9;' +
      'border-radius:12px 12px 3px 12px;padding:9px 12px;font-size:13.5px;line-height:1.6;' +
      'color:#39404f;text-wrap:pretty">' + esc(m.content) + '</span></div>';
  return '<div style="margin:0 0 12px">' +
    '<div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div style="font-size:13.5px;line-height:1.65;color:#39404f;text-wrap:pretty">' +
    mdChat(m.content) + '</div></div>';
}

function chatBox(q, acertou){
  if (!dsOn()) return '';
  var chamada = acertou ? 'Quer ir mais fundo?' : 'Ainda com dúvida?';
  var dica = acertou ? 'Por que as outras estão erradas?' : 'Por que a que eu marquei está errada?';
  var hist = (S.chat[q.id] || []).map(msgHTML).join('');
  return '<div id="ds" data-qid="' + q.id + '" style="margin-top:14px;border:1px solid #e4e0d8;' +
      'border-radius:14px;background:#fff;overflow:hidden;animation:qFade .26s ease">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:11px 15px;' +
        'border-bottom:1px solid #f0ede6;background:#faf9f6">' +
        '<span style="' + DS_MONO + ';font-size:10px;letter-spacing:.16em;text-transform:uppercase;' +
        'color:#2b57cc">' + chamada + '</span>' +
        '<span style="font-size:12px;color:#8a8578">pergunte ao DeepSeek</span></div>' +
      '<div id="dsLog" style="max-height:280px;overflow-y:auto;padding:' + (hist ? '12px 15px' : '0') + '">' +
        hist + '</div>' +
      '<div style="display:flex;gap:8px;padding:11px 12px;border-top:1px solid #f0ede6">' +
        '<input id="dsIn" type="text" autocomplete="off" ' +
          'placeholder="' + dica + '" ' +
          'style="flex:1;min-width:0;border:1px solid #e4e0d8;border-radius:10px;padding:10px 12px;' +
          'font-size:13.5px;' + DS_SANS + ';color:#121a2b;background:#fff;outline:none">' +
        '<button type="button" data-act="dsSend" class="h-darkflat" style="flex-shrink:0;' +
          'background:#121a2b;color:#f5f3ef;border:0;border-radius:10px;padding:10px 16px;' +
          'font-size:13px;font-weight:500;cursor:pointer;transition:background .16s ease">Enviar</button>' +
      '</div></div>';
}

function dsContexto(q, ans){
  var alts = q.options.map(function(o, n){ return LETTERS[n] + ') ' + o; }).join(NLJS);
  return 'Questao: ' + q.question + NLJS + alts + NLJS +
    'Resposta correta: ' + LETTERS[q.correctIndex] + ') ' + q.options[q.correctIndex] + NLJS +
    'O estudante marcou: ' + (ans === null ? 'nada' : LETTERS[ans] + ') ' + q.options[ans]) + NLJS +
    'Explicacao que ele ja tem: ' + q.explanation;
}

A.dsSend = function(){
  var box = document.getElementById('ds');
  if (!box || !dsOn() || box.getAttribute('data-busy')) return;
  var input = document.getElementById('dsIn'), log = document.getElementById('dsLog');
  var texto = (input.value || '').trim();
  if (!texto) return;

  var qid = parseInt(box.getAttribute('data-qid'), 10), q = null, ans = null;
  for (var i = 0; i < S.order.length; i++)
    if (S.order[i].id === qid) { q = S.order[i]; ans = S.answers[i]; }
  if (!q) return;

  S.chat[qid] = S.chat[qid] || [];
  S.chat[qid].push({ role:'user', content:texto });
  input.value = '';
  log.style.padding = '12px 15px';
  log.insertAdjacentHTML('beforeend', msgHTML({ role:'user', content:texto }));
  log.insertAdjacentHTML('beforeend',
    '<div><div style="' + DS_MONO + ';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;' +
    'color:#2b57cc;margin-bottom:4px">DeepSeek</div>' +
    '<div id="dsTxt" style="font-size:13.5px;line-height:1.65;color:#8a8578;' +
    'text-wrap:pretty">pensando…</div></div>');
  log.scrollTop = log.scrollHeight;
  box.setAttribute('data-busy', '1');

  var acertou = (ans === q.correctIndex);
  var situacao = acertou
    ? 'Voce e um tutor de medicina. O estudante do 7o semestre ACERTOU esta questao, mas ficou com uma duvida. '
    : 'Voce e um tutor de medicina. O estudante do 7o semestre ERROU esta questao. ';
  var msgs = [
    { role:'system', content: situacao +
      'Responda em portugues do Brasil, direto ao ponto, no maximo 150 palavras. ' +
      'Traga o dado concreto (valor, criterio, mecanismo) em vez de generalidade. ' +
      'Nao repita a explicacao que ele ja tem; foque na duvida que ele trouxe.' },
    { role:'user', content: dsContexto(q, ans) }
  ];
  var h = S.chat[qid];
  for (var j = 0; j < h.length; j++) msgs.push({ role:h[j].role, content:h[j].content });

  dsStream(msgs, function(txt, fim, erro){
    var el = document.getElementById('dsTxt');
    if (!el) { box.removeAttribute('data-busy'); return; }
    if (erro) { el.style.color = '#c04437'; el.textContent = erro; box.removeAttribute('data-busy'); return; }
    el.style.color = '#39404f';
    el.innerHTML = mdChat(txt);
    var lg = document.getElementById('dsLog'); if (lg) lg.scrollTop = lg.scrollHeight;
    if (fim) { el.removeAttribute('id'); S.chat[qid].push({ role:'assistant', content:txt }); box.removeAttribute('data-busy'); }
  });
};

function dsStream(messages, cb){
  var acc = '';
  fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + window.DEEPSEEK_KEY },
    body: JSON.stringify({ model:DS_MODEL, messages:messages, stream:true, max_tokens:1200, temperature:0.3 })
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){
      throw new Error(
        r.status === 401 ? 'Chave recusada (401). Confira o deepseek_key.js.' :
        r.status === 402 ? 'Sem saldo na conta DeepSeek (402).' :
        r.status === 429 ? 'Limite de uso atingido (429). Tente daqui a pouco.' :
        'Erro ' + r.status + ': ' + String(t).slice(0, 120));
    });
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    (function pump(){
      return reader.read().then(function(res){
        if (res.done) { cb(acc || '(resposta vazia)', true); return; }
        buf += dec.decode(res.value, { stream:true });
        var linhas = buf.split(NLJS);
        buf = linhas.pop();
        for (var i = 0; i < linhas.length; i++){
          var l = linhas[i].trim();
          if (l.indexOf('data:') !== 0) continue;
          var carga = l.slice(5).trim();
          if (carga === '[DONE]') continue;
          try {
            var d = JSON.parse(carga).choices[0].delta;
            if (d && d.content) { acc += d.content; cb(acc, false); }
          } catch (_){}
        }
        return pump();
      });
    })();
  }).catch(function(e){
    cb('', true, 'Nao consegui falar com o DeepSeek: ' + (e && e.message ? e.message : e));
  });
}

function render(){
  renderHeader();
  if (S.view === 'home')        renderHome();
  else if (S.view === 'resumo') renderResumo();
  else if (S.finished)          renderResult();
  else                          renderQuestion();
}

/* lightbox: clique em qualquer figura amplia */
document.addEventListener('click', function(e){
  var lb = document.getElementById('lb');
  if (e.target.closest('#lb')) { lb.className = ''; return; }
  var img = e.target.closest('.fig img');
  if (img) { lb.firstElementChild.src = img.src; lb.className = 'on'; }
});
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.getElementById('lb').className = '';
});

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), n = parseInt(b.getAttribute('data-n'),10), k = b.getAttribute('data-k');
  if (act==='pick'||act==='jump'||act==='toggle') A[act](n);
  else if (act==='filter') A.filter(k);
  else if (A[act]) A[act]();
});

window.addEventListener('keydown', function(e){
  if (S.view!=='quiz' || !S.started || S.finished) return;
  var t = e.target, tag = t && t.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || (t && t.isContentEditable)) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='ArrowRight')     { e.preventDefault(); A.go(S.i+1); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); A.go(S.i-1); }
  else if (e.key==='Enter')     { e.preventDefault(); A.next(); }
  else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key,10)-1;
    if (n < S.order[S.i].options.length) A.pick(n);
  }
});

render();
</script>
